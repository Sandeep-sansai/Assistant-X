function renderBoard(animate) {
  const r = state.planResult;
  const board = $('plBoard');
  board.replaceChildren();
  let order = 0;
  r.semesters.forEach((s, index) => {
    const col = el('section', 'pl-col');
    col.dataset.index = String(index);
    const head = el('header', 'pl-col-head');
    head.title = t('plan.openSemester');
    head.append(...semesterHead(s, 'div'));
    head.addEventListener('click', () => { state.planStep = index; setPlanView('step'); });
    col.append(head);
    const list = el('div', 'pl-cards');
    for (const m of s.modules) {
      const card = moduleCard(m, index, s.winter);
      if (animate) { card.classList.add('enter'); card.style.animationDelay = `${order * 30}ms`; }
      order += 1;
      list.append(card);
    }
    col.append(list);
    const add = el('button', 'pl-add', t('plan.add'));
    add.type = 'button';
    add.addEventListener('click', () => openPicker(index));
    col.append(add);
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drop'); });
    col.addEventListener('dragleave', () => col.classList.remove('drop'));
    col.addEventListener('drop', (e) => {
      e.preventDefault();
      col.classList.remove('drop');
      const code = e.dataTransfer.getData('text/plain');
      if (code) moveModule(code, index);
    });
    board.append(col);
  });
}

/** One semester at a time: its modules on the left, what is taught that term on the right. */
function renderStep(animate) {
  const r = state.planResult;
  const box = $('plStep');
  const index = Math.max(0, Math.min(state.planStep, r.semesters.length - 1));
  state.planStep = index;
  const s = r.semesters[index];
  const term = parseTermId(s.term);
  box.replaceChildren();

  const tabs = el('div', 'pl-tabs');
  tabs.setAttribute('role', 'tablist');
  r.semesters.forEach((x, i) => {
    const tab = el('button', 'pl-tab');
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(i === index));
    const tm = parseTermId(x.term);
    const load = el('div', 'pl-load');
    const fill = el('i', x.credits > 33 ? 'heavy' : null);
    fill.style.width = `${Math.min(100, Math.round(x.credits / 30 * 100))}%`;
    load.append(fill);
    tab.append(el('b', null, `${t('plan.semester', x.number)} · ${x.credits} CP`), el('span', null, tm ? termLabel(tm) : ''), load);
    tab.addEventListener('click', () => { state.planStep = i; renderStep(); });
    tabs.append(tab);
  });
  box.append(tabs);

  const body = el('div', 'pl-step-body');
  const mine = el('section', 'pl-pane');
  mine.append(...semesterHead(s, 'h3'));
  const list = el('div', 'pl-cards');
  s.modules.forEach((m, n) => {
    const card = moduleCard(m, index, s.winter);
    if (animate) { card.classList.add('enter'); card.style.animationDelay = `${n * 30}ms`; }
    list.append(card);
  });
  if (!s.modules.length) list.append(el('p', 'empty', t('plan.emptySem')));
  mine.append(list);
  const nav = el('div', 'pl-step-nav');
  const prev = el('button', 'btn', t('plan.prev'));
  prev.type = 'button'; prev.disabled = index === 0;
  prev.addEventListener('click', () => { state.planStep = index - 1; renderStep(); });
  const next = el('button', 'btn', t('plan.next'));
  next.type = 'button'; next.disabled = index === r.semesters.length - 1;
  next.addEventListener('click', () => { state.planStep = index + 1; renderStep(); });
  nav.append(prev, next);
  mine.append(nav);

  const avail = el('section', 'pl-pane pl-avail');
  avail.append(el('h3', null, t('plan.availableIn', term ? termLabel(term) : '')));
  const tools = el('div', 'pl-avail-tools');
  const search = el('input', 'pk-search');
  search.type = 'search';
  search.placeholder = t('plan.search');
  search.value = state.stepQuery;
  const only = el('label', 'pk-filter');
  const box2 = el('input');
  box2.type = 'checkbox';
  box2.checked = state.stepOnlyTerm;
  only.append(box2, el('span', null, t('plan.onlyThisTerm')));
  tools.append(search, only);
  const results = el('div', 'pk-list');
  const fill = () => {
    const opts = { winter: s.winter, query: state.stepQuery, onlyTerm: state.stepOnlyTerm,
      onAdd: (code) => { state.plan.semesters[index].push(code); recheck(); } };
    let sections = catalogueSections({ ...opts, onlyMissing: true });
    // Every area already has its credits: offer the alternatives, to swap a module for another one.
    const swap = !sections.length;
    if (swap) sections = catalogueSections({ ...opts, onlyMissing: false });
    results.replaceChildren(...(swap && sections.length ? [el('p', 'pl-hint', t('plan.swapHint'))] : []), ...sections);
    if (!sections.length) results.append(el('p', 'empty', t('plan.stepNone')));
  };
  search.addEventListener('input', () => { state.stepQuery = search.value; fill(); });
  box2.addEventListener('change', () => { state.stepOnlyTerm = box2.checked; fill(); });
  fill();
  avail.append(tools, results);
  body.append(mine, avail);
  box.append(body);
}

const TERM_LETTER = { WINTER: 'W', SUMMER: 'S', BOTH: 'W·S', UNKNOWN: '?' };

function moduleCard(m, index, winter) {
  const wrongTerm = (m.offered === 'WINTER' && !winter) || (m.offered === 'SUMMER' && winter);
  const kind = m.thesis ? ' thesis' : (m.requirement && m.requirement.startsWith('8.')) ? ' focus' : '';
  const card = el('article', `pl-card${kind}${wrongTerm ? ' bad' : ''}`);
  card.draggable = true;
  card.tabIndex = 0;
  card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', m.code); card.classList.add('dragging'); });
  card.addEventListener('dragend', () => card.classList.remove('dragging'));
  const top = el('div', 'pl-card-top');
  const title = el('a', 'pl-title', uiTitle(m.title));
  title.href = m.url; title.target = '_blank'; title.rel = 'noopener';
  title.title = t('plan.officialPage');
  const badge = el('span', `term term-${m.offered.toLowerCase()}`, TERM_LETTER[m.offered] || '?');
  badge.title = t(OFFERED_BADGE[m.offered] || 'plan.unknown');
  top.append(title, badge);
  card.append(top);
  const meta = el('div', 'pl-meta');
  meta.append(el('span', null, `${m.credits} CP`));
  if (m.requirement && !m.thesis) { meta.append(el('span', null, '·'), el('span', 'req', requirementTitle(m.requirement))); }
  if (m.oralExam) { const oral = el('span', 'oral', '🎤'); oral.title = t('plan.oral'); meta.append(oral); }
  card.append(meta);
  const actions = el('div', 'pl-actions');
  const button = (label, tip, fn) => { const b = el('button', null, label); b.type = 'button'; b.title = tip; b.setAttribute('aria-label', `${tip}: ${uiTitle(m.title)}`); b.addEventListener('click', fn); actions.append(b); };
  if (index > 0) button('←', t('plan.moveEarlier'), () => moveModule(m.code, index - 1));
  if (index < state.plan.semesters.length - 1) button('→', t('plan.moveLater'), () => moveModule(m.code, index + 1));
  if (!m.thesis) button('✓', t('plan.markDone'), () => markCompleted(m.code));
  button('✕', t('plan.remove'), () => removeModule(m.code));
  card.append(actions);
  return card;
}

function removeEverywhere(code) {
  state.plan.semesters = state.plan.semesters.map((s) => s.filter((c) => c !== code));
}
function moveModule(code, index) { removeEverywhere(code); state.plan.semesters[index].push(code); recheck(); }
function removeModule(code) { removeEverywhere(code); recheck(); }
function markCompleted(code) {
  removeEverywhere(code);
  if (!state.plan.completed.includes(code)) state.plan.completed.push(code);
  recheck();
}
function reopenCompleted(code) {
  state.plan.completed = state.plan.completed.filter((c) => c !== code);
  state.plan.semesters[Math.min(state.planStep, state.plan.semesters.length - 1)].push(code);
  recheck();
}

function warningText(w) {
  const p = w.params;
  const titleOf = (code) => uiTitle((state.catalogue.programme.modules[code] || { title: code }).title);
  switch (w.type) {
    case 'WRONG_TERM': return t('plan.w.wrongTerm', titleOf(p[0]), p[1], t(p[2] === 'WINTER' ? 'plan.inWinter' : 'plan.inSummer'));
    case 'UNKNOWN_TERM': return t('plan.w.unknownTerm', titleOf(p[0]));
    case 'HEAVY_SEMESTER': return t('plan.w.heavy', p[0], p[1]);
    case 'THESIS_TOO_EARLY': return t('plan.w.thesisEarly', p[0], p[1], p[2]);
    case 'REQUIREMENT_UNMET': return t('plan.w.unmet', requirementTitle(p[0]) || p[0], p[1]);
    case 'NO_ORAL_EXAM': return t('plan.w.noOral');
    case 'NOT_OFFERED_RECENTLY': return t('plan.w.notRecently', titleOf(p[0]));
    default: return w.type;
  }
}

function renderPlanSide() {
  const r = state.planResult;
  $('plRing').replaceChildren(ring(r.credits, r.requiredCredits));
  const status = $('plStatus');
  const clashLines = planClashSummary();
  const issues = r.warnings.length + clashLines.length;
  status.className = `status-pill ${issues ? 'warn' : 'ok'}`;
  status.textContent = issues ? `⚠ ${t('plan.statusIssues', issues)}` : `✓ ${t('plan.statusOk')}`;
  const reqs = $('plReqs');
  reqs.replaceChildren();
  // Areas that still need credits first; complete ones are a quiet list below.
  const ordered = [...r.requirements].sort((a, b) => Number(a.met) - Number(b.met));
  for (const q of ordered) {
    const li = el('li', q.met ? 'met' : '');
    const top = el('div', 'rq-top');
    top.append(el('span', 'rq-name', shortRequirement(q.title)), el('b', null, `${q.planned}/${q.required}`));
    const bar = el('div', 'rq-bar');
    const fill = el('i');
    fill.style.width = `${Math.min(100, Math.round(q.planned / q.required * 100))}%`;
    bar.append(fill);
    li.append(top, bar);
    reqs.append(li);
  }
  const warn = $('plWarnings');
  warn.replaceChildren();
  if (!issues) warn.append(el('li', 'ok', `✓ ${t('plan.allGood')}`));
  for (const w of r.warnings) warn.append(el('li', 'warn', warningText(w)));
  for (const c of clashLines) warn.append(el('li', 'warn', c));
  for (const n of r.notes) {
    const text = n.type === 'MENTORING' ? t('plan.n.mentoring') : t('plan.n.thesis', n.params[0], n.params[1]);
    warn.append(el('li', 'note', text));
  }
  const done = $('plDone');
  done.replaceChildren();
  $('plDoneCard').hidden = !state.plan.completed.length;
  for (const code of state.plan.completed) {
    const m = state.catalogue.programme.modules[code];
    const li = el('li');
    li.append(el('span', null, `✓ ${m ? uiTitle(m.title) : code}`));
    const undo = el('button', 'link-like', t('plan.undo'));
    undo.type = 'button';
    undo.addEventListener('click', () => reopenCompleted(code));
    li.append(undo);
    done.append(li);
  }
}

/** The module catalogue for one semester, grouped by the requirements of the chosen focus. */
let pickReplace = null;   // { code, requirement } when swapping a module for another of the same area

function openPicker(index, replace) {
  pickSemester = index;
  pickReplace = replace || null;
  const s = state.planResult.semesters[index];
  const term = parseTermId(s.term);
  $('pkTitle').textContent = replace ? t('wk.swapTitle', moduleName(replace.code), term ? termLabel(term) : '')
    : t('plan.pickTitle', s.number, term ? termLabel(term) : '');
  $('pkSearch').value = '';
  // With every area complete there is nothing "missing" to show; list everything instead.
  $('pkMissing').checked = !replace && state.planResult.requirements.some((q) => !q.met);
  renderPicker();
  $('pickDialog').showModal();
  $('pkSearch').focus();
}

/**
 * Modules not planned yet, grouped by requirement. {@code onlyTerm} hides modules not taught in
 * that semester; {@code onlyMissing} hides requirements that are already met.
 */
function catalogueSections({ winter, term, query, onlyMissing, onlyTerm, onlyRequirement, onAdd }) {
  const programme = state.catalogue.programme;
  const planned = new Set([...state.plan.semesters.flat(), ...state.plan.completed]);
  const q = (query || '').trim().toLowerCase();
  const sections = [];
  for (const req of state.planResult.requirements) {
    if (onlyMissing && req.met) continue;
    if (onlyRequirement && req.code !== onlyRequirement) continue;
    const group = programme.groups.find((g) => g.code === req.code);
    const codes = new Set(group ? group.modules : []);
    // A focus requirement without its own list (e.g. "Advanced courses") takes the modules of its parts.
    if (!codes.size) programme.groups.filter((g) => g.code.startsWith(`${req.code}.`)).forEach((g) => g.modules.forEach((c) => codes.add(c)));
    const modules = [...codes].map((c) => programme.modules[c]).filter((m) => {
      if (!m || planned.has(m.code)) return false;
      const fits = m.offered === 'BOTH' || m.offered === 'UNKNOWN' || (m.offered === 'WINTER') === winter;
      if (onlyTerm && !fits) return false;
      return !q || m.title.toLowerCase().includes(q) || uiTitle(m.title).toLowerCase().includes(q) || m.code.toLowerCase().includes(q);
    });
    if (!modules.length) continue;
    const section = el('section', 'pk-group');
    section.append(el('h3', null, `${shortRequirement(req.title)} · ${req.planned}/${req.required} CP`));
    for (const m of modules) {
      const row = el('div', 'pk-row');
      const text = el('div');
      text.append(el('span', 'pk-title', uiTitle(m.title)));
      const fits = m.offered === 'BOTH' || m.offered === 'UNKNOWN' || (m.offered === 'WINTER') === winter;
      const times = term ? moduleTimes(m.code, term) : '';
      text.append(el('span', 'pk-meta', `${m.credits} CP · ${t(OFFERED_BADGE[m.offered] || 'plan.unknown')}${m.oralExam ? ' · 🎤' : ''}${times ? ` · ${times}` : ''}${fits ? '' : ` · ⚠ ${t('plan.notThisTerm')}`}`));
      const add = el('button', 'btn', t('plan.addShort'));
      add.type = 'button';
      add.addEventListener('click', () => onAdd(m.code));
      row.append(text, add);
      section.append(row);
    }
    sections.push(section);
  }
  return sections;
}

function renderPicker() {
  const list = $('pkList');
  const sem = state.planResult.semesters[pickSemester];
  list.replaceChildren(...catalogueSections({
    winter: sem.winter, term: sem.term, query: $('pkSearch').value, onlyMissing: $('pkMissing').checked, onlyTerm: Boolean(pickReplace),
    onlyRequirement: pickReplace && pickReplace.requirement,
    onAdd: (code) => {
      if (pickReplace) removeEverywhere(pickReplace.code);
      state.plan.semesters[pickSemester].push(code);
      pickReplace = null;
      $('pickDialog').close();
      recheck();
    },
  }));
  if (!list.childElementCount) list.append(el('p', 'empty', t('plan.pickNone')));
}

// ---- timetable: week view and clashes ----
// Imported times come from the eCampus course catalogue (GET /api/timetable); times a student adds
// by hand are kept in the browser per module and apply to every semester the module is planned in.
const SLOTS_KEY = 'uka.slots';
state.timetable = { available: [], slots: [] };
state.manualSlots = store.get(SLOTS_KEY, {});
const DAYS = ['', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
const WK_FROM = 8;
const WK_TO = 20;
const WK_COLORS = ['#e1e8f5', '#dee489', '#f8d3e2', '#d5ecd9', '#fde3c3', '#e2dcf3', '#cfe9ef', '#f3e1d6'];

async function loadTimetable(programme) {
  try {
    state.timetable = await getJson(`/api/timetable?programme=${encodeURIComponent(programme)}`);
  } catch { state.timetable = { available: [], slots: [] }; }
  if (!$('planner').hidden && state.planResult) { renderPlanSide(); if (state.planView === 'week') renderWeek(); }
}

// eCampus only has German labels; with English chosen they are shown in English.
const KIND_EN = [[/Vorlesung\/Übung/g, 'Lecture/exercise'], [/Vorlesung/g, 'Lecture'], [/Übungen/g, 'Exercises'], [/Übung/g, 'Exercise'],
  [/Tutorium/g, 'Tutorial'], [/Praktikum/g, 'Practical'], [/Labor/g, 'Lab'], [/Projekt/g, 'Project'], [/Kolloquium/g, 'Colloquium'],
  [/Blockveranstaltung/g, 'Block course'], [/(\d+)\. PG/g, 'group $1']];
const ROOM_EN = [[/Hörsaal/g, 'Lecture hall'], [/Seminarraum/g, 'Seminar room'], [/Raum/g, 'Room'], [/Labor/g, 'Lab'],
  [/-altes Gebäude/g, ' old building'], [/-neues Gebäude/g, ' new building'], [/Gebäude/g, 'building'], [/\(EG\)/g, '(ground floor)'],
  [/\((\d)\. ?OG\)/g, '(floor $1)'], [/\((\d)\. ?UG\)/g, '(basement $1)'], [/\bUG\b/g, 'basement'], [/\bOG\b/g, 'floor']];
const englishLabel = (text, rules) => (state.lang === 'en' && text) ? rules.reduce((x, [re, to]) => x.replace(re, to), text) : (text || '');
const kindLabel = (kind) => englishLabel(kind, KIND_EN);
const roomLabel = (room) => englishLabel(room, ROOM_EN);

const minutes = (hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); return h * 60 + (m || 0); };
const hhmm = (min) => `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;

/**
 * The semester whose imported times stand for {@code term}: the term itself, or else the latest
 * imported semester of the same season (times usually repeat yearly), marked as an estimate.
 */
function timetableTerm(term) {
  const available = state.timetable.available || [];
  if (available.includes(term)) return { term, estimate: false };
  const same = available.find((x) => x.slice(0, 2) === term.slice(0, 2));
  return same ? { term: same, estimate: true } : null;
}

/** Every slot of the given modules in one semester: imported ones and the student's own. */
function semesterSlots(semester) {
  const codes = new Set(semester.modules.map((m) => m.code));
  const source = timetableTerm(semester.term);
  const slots = [];
  if (source) {
    for (const x of state.timetable.slots) {
      if (x.term === source.term && x.moduleCode && codes.has(x.moduleCode)) {
        slots.push({ code: x.moduleCode, kind: x.kind, weekday: x.weekday, start: minutes(x.start), end: minutes(x.end), room: x.room, url: x.sourceUrl });
      }
    }
  }
  for (const code of codes) {
    (state.manualSlots[code] || []).forEach((x, i) => slots.push({ code, kind: x.kind, weekday: x.weekday, start: minutes(x.start), end: minutes(x.end), manual: i }));
  }
  // Alternative groups: eCampus marks them "· 2. PG"; for hand-entered times, several slots of the
  // same type of one module count as groups. Attending one of them is enough.
  const counts = {};
  for (const x of slots) if (x.manual !== undefined) counts[`${x.code}|${x.kind || ''}`] = (counts[`${x.code}|${x.kind || ''}`] || 0) + 1;
  for (const x of slots) x.group = /\d+\. PG/.test(x.kind || '') || (x.manual !== undefined && counts[`${x.code}|${x.kind || ''}`] > 1);
  return { slots, source };
}

/** Pairs of overlapping slots of different modules; soft when one side is just one of several groups. */
function clashes(slots) {
  const found = [];
  for (let i = 0; i < slots.length; i++) {
    for (let j = i + 1; j < slots.length; j++) {
      const a = slots[i]; const b = slots[j];
      if (a.code !== b.code && a.weekday === b.weekday && a.start < b.end && b.start < a.end) found.push({ a, b, soft: a.group || b.group });
    }
  }
  return found;
}

function moduleName(code) {
  const m = state.catalogue.programme.modules[code];
  return m ? uiTitle(m.title) : code;
}

function slotText(x) { return `${t(`day.${DAYS[x.weekday]}`)} ${hhmm(x.start)}–${hhmm(x.end)}`; }

/** "Mon 10:00–12:00, Wed 14:00–16:00": a module's known times in a semester, or ''. */
function moduleTimes(code, term) {
  const fake = { term, modules: [{ code }] };
  return semesterSlots(fake).slots.map(slotText).join(', ');
}

/**
 * The nearest other semester (index) where a module is taught and would not clash with what is
 * planned there, or null. Semesters without known times count as free of clashes.
 */
function freeSemesterFor(code, from) {
  const r = state.planResult;
  const m = state.catalogue.programme.modules[code];
  if (!m) return null;
  const order = r.semesters.map((_, i) => i).filter((i) => i !== from && !r.semesters[i].modules.some((x) => x.thesis))
    .sort((a, b) => Math.abs(a - from) - Math.abs(b - from));
  for (const i of order) {
    const sem = r.semesters[i];
    const taught = m.offered === 'BOTH' || m.offered === 'UNKNOWN' || (m.offered === 'WINTER') === sem.winter;
    if (!taught) continue;
    const trial = { term: sem.term, modules: [...sem.modules, { code }] };
    if (!clashes(semesterSlots(trial).slots).some((c) => !c.soft && (c.a.code === code || c.b.code === code))) return i;
  }
  return null;
}

/** Side-by-side columns for overlapping slots of one day: each slot gets a lane and the lane count of its cluster. */
function layoutLanes(daySlots) {
  const result = new Map();
  let cluster = [];
  let clusterEnd = -1;
  const close = () => {
    const ends = [];
    for (const x of cluster) {
      let lane = ends.findIndex((end) => end <= x.start);
      if (lane < 0) { lane = ends.length; ends.push(0); }
      ends[lane] = x.end;
      result.set(x, { lane, of: 0 });
    }
    for (const x of cluster) result.get(x).of = ends.length;
    cluster = [];
  };
  for (const x of daySlots) {
    if (cluster.length && x.start >= clusterEnd) close();
    cluster.push(x);
    clusterEnd = Math.max(clusterEnd, x.end);
  }
  if (cluster.length) close();
  return result;
}

/** One line per semester with hard clashes, for the "Check" card. */
function planClashSummary() {
  if (!state.planResult) return [];
  const lines = [];
  for (const s of state.planResult.semesters) {
    const hard = clashes(semesterSlots(s).slots).filter((c) => !c.soft);
    if (hard.length) lines.push(t('wk.semClashes', s.number, hard.length));
  }
  return lines;
}

function renderWeek() {
  const r = state.planResult;
  const box = $('plWeek');
  const index = Math.max(0, Math.min(state.planStep, r.semesters.length - 1));
  state.planStep = index;
  const s = r.semesters[index];
  const term = parseTermId(s.term);
  box.replaceChildren();

  // Semester tabs, each with its clash count.
  const tabs = el('div', 'pl-tabs');
  tabs.setAttribute('role', 'tablist');
  r.semesters.forEach((x, i) => {
    const tab = el('button', 'pl-tab');
    tab.type = 'button';
    tab.setAttribute('role', 'tab');
    tab.setAttribute('aria-selected', String(i === index));
    const n = clashes(semesterSlots(x).slots).filter((c) => !c.soft).length;
    const tm = parseTermId(x.term);
    tab.append(el('b', null, `${t('plan.semester', x.number)}${n ? ` · ⚠ ${n}` : ''}`), el('span', null, tm ? termLabel(tm) : ''));
    tab.addEventListener('click', () => { state.planStep = i; renderWeek(); });
    tabs.append(tab);
  });
  box.append(tabs);

  const { slots, source } = semesterSlots(s);
  const head = el('div', 'wk-head');
  head.append(el('h3', null, term ? termLabel(term) : ''));
  let srcText = t('wk.noTimes');
  if (source && !source.estimate) srcText = t('wk.fromCatalogue');
  else if (source) { const st = parseTermId(source.term); srcText = t('wk.estimate', st ? termLabel(st) : source.term); }
  head.append(el('span', `wk-src${source && source.estimate ? ' estimate' : ''}`, srcText));
  box.append(head);

  // The semester's planned modules, with their times or "no times yet".
  const strip = el('div', 'wk-mods');
  s.modules.forEach((m, i) => {
    const chip = el('div', 'wk-mod');
    const sw = el('i');
    sw.style.background = m.thesis ? 'var(--lime)' : WK_COLORS[i % WK_COLORS.length];
    const body = el('div');
    body.append(el('b', null, uiTitle(m.title)));
    const times = slots.filter((x) => x.code === m.code);
    body.append(el('span', null, m.thesis ? t('wk.thesis') : times.length ? times.map((x) => `${slotText(x)}${x.kind ? ` ${kindLabel(x.kind)}` : ''}`).join(' · ') : t('wk.noTimesFor')));
    chip.append(sw, body);
    strip.append(chip);
  });
  box.append(strip);

  // Colour per module, stable within the semester.
  const colour = {};
  s.modules.forEach((m, i) => { colour[m.code] = WK_COLORS[i % WK_COLORS.length]; });
  const found = clashes(slots);
  const inClash = new Map();
  for (const c of found) for (const x of [c.a, c.b]) inClash.set(x, (inClash.get(x) || false) || !c.soft);

  const days = slots.some((x) => x.weekday === 6) ? 6 : 5;
  const grid = el('div', 'wk-grid');
  const hour = 44;
  grid.style.setProperty('--days', String(days));
  grid.style.setProperty('--hour', `${hour}px`);
  grid.append(el('div', 'wk-day', ''));
  for (let d = 1; d <= days; d++) grid.append(el('div', 'wk-day', t(`day.${DAYS[d]}`)));
  const times = el('div', 'wk-times');
  times.style.height = `${(WK_TO - WK_FROM) * hour}px`;
  for (let h = WK_FROM + 1; h < WK_TO; h++) { const sp = el('span', null, `${h}:00`); sp.style.top = `${(h - WK_FROM) * hour}px`; times.append(sp); }
  grid.append(times);
  for (let d = 1; d <= days; d++) {
    const col = el('div', 'wk-col');
    col.style.height = `${(WK_TO - WK_FROM) * hour}px`;
    const daySlots = slots.filter((x) => x.weekday === d).sort((a, b) => a.start - b.start);
    const lanes = layoutLanes(daySlots);
    daySlots.forEach((x) => {
      const top = Math.max(0, (x.start - WK_FROM * 60) / 60 * hour);
      const height = Math.max(18, (Math.min(x.end, WK_TO * 60) - Math.max(x.start, WK_FROM * 60)) / 60 * hour - 2);
      const block = el('div', `wk-slot${inClash.get(x) ? ' clash' : ''}${x.group ? ' group' : ''}`);
      const { lane, of } = lanes.get(x);
      block.style.left = `calc(${lane / of * 100}% + 3px)`;
      block.style.width = `calc(${100 / of}% - 6px)`;
      block.style.right = 'auto';
      block.style.top = `${top}px`;
      block.style.height = `${height}px`;
      block.style.background = colour[x.code] || WK_COLORS[0];
      block.title = `${moduleName(x.code)} · ${kindLabel(x.kind)} · ${slotText(x)}${x.room ? ` · ${roomLabel(x.room)}` : ''}`;
      block.append(el('b', null, moduleName(x.code)), `${hhmm(x.start)}–${hhmm(x.end)}${x.kind ? ` · ${kindLabel(x.kind)}` : ''}`);
      if (x.room) block.append(el('div', null, roomLabel(x.room)));
      if (x.manual !== undefined) {
        const del = el('button', 'x', '✕');
        del.type = 'button';
        del.setAttribute('aria-label', t('wk.remove'));
        del.addEventListener('click', () => {
          state.manualSlots[x.code].splice(x.manual, 1);
          if (!state.manualSlots[x.code].length) delete state.manualSlots[x.code];
          store.set(SLOTS_KEY, state.manualSlots);
          renderWeek(); renderPlanSide();
        });
        block.append(del);
      }
      col.append(block);
    });
    grid.append(col);
  }
  if (!slots.length) {
    const empty = el('div', 'wk-empty', s.modules.some((m) => !m.thesis) ? t('wk.gridEmpty') : t('plan.emptySem'));
    grid.append(empty);
  }
  box.append(grid);
  const legend = el('div', 'wk-legend');
  const key = (cls, text) => { const sp = el('span'); const i = el('i'); i.style.cssText = cls; sp.append(i, text); legend.append(sp); };
  key('box-shadow:inset 0 0 0 2px var(--magenta)', t('wk.legendClash'));
  key('border-left:3px dashed rgba(0,0,0,.35); background:var(--surface-2)', t('wk.legendGroup'));
  box.append(legend);

  // Clashes and the modules that have no times yet, with a form to add them.
  const panels = el('div', 'wk-panels');
  const left = el('section', 'pl-pane');
  left.append(el('h4', null, t('wk.clashes')));
  const list = el('ul', 'wk-clashes');
  if (!found.length) list.append(el('li', 'ok', slots.length ? `✓ ${t('wk.noClashes')}` : t('wk.nothingToCheck')));
  const shown = new Set();
  for (const c of found) {
    const li = el('li', c.soft ? 'soft' : '');
    li.append(el('span', null, t(c.soft ? 'wk.softClash' : 'wk.clash', moduleName(c.a.code), slotText(c.a), moduleName(c.b.code), slotText(c.b))));
    // Fixes right here: move one of the two to a semester where it's taught and doesn't clash, or swap it.
    const fixes = el('div', 'wk-fixes');
    for (const code of [c.a.code, c.b.code]) {
      const planned = s.modules.find((m) => m.code === code);
      const target = freeSemesterFor(code, index);
      if (target !== null) {
        const move = el('button', 'btn', t('wk.moveTo', moduleName(code), r.semesters[target].number));
        move.type = 'button';
        move.addEventListener('click', () => { moveModule(code, target); });
        fixes.append(move);
      }
      if (planned && planned.requirement && !planned.thesis) {
        const swap = el('button', 'btn', t('wk.swap', moduleName(code)));
        swap.type = 'button';
        swap.addEventListener('click', () => openPicker(index, { code, requirement: planned.requirement }));
        fixes.append(swap);
      }
      shown.add(code);
    }
    if (fixes.childElementCount && !c.soft) li.append(fixes);
    list.append(li);
  }
  left.append(list);
  const right = el('section', 'pl-pane');
  right.append(el('h4', null, t('wk.addTimes')));
  const timed = new Set(slots.map((x) => x.code));
  const missing = s.modules.filter((m) => !timed.has(m.code) && !m.thesis);
  if (missing.length) {
    const chips = el('div', 'wk-missing');
    chips.append(el('span', null, t('wk.missing', missing.length)));
    right.append(chips);
  }
  const form = el('form', 'wk-form');
  const field = (label, input, wide) => { const l = el('label', wide ? 'wide' : null); l.append(label, input); form.append(l); return input; };
  const mod = el('select');
  for (const m of [...missing, ...s.modules.filter((m) => timed.has(m.code) && !m.thesis)]) mod.append(new Option(uiTitle(m.title), m.code));
  field(t('wk.module'), mod, true);
  const day = el('select');
  for (let d = 1; d <= 6; d++) day.append(new Option(t(`day.${DAYS[d]}`), String(d)));
  field(t('wk.day'), day);
  const kind = el('select');
  for (const k of ['lecture', 'exercise', 'lab', 'seminar']) kind.append(new Option(t(`wk.kind.${k}`), t(`wk.kind.${k}`)));
  field(t('wk.kind'), kind);
  const from = el('input'); from.type = 'time'; from.value = '10:00'; from.step = 900;
  field(t('wk.from'), from);
  const to = el('input'); to.type = 'time'; to.value = '12:00'; to.step = 900;
  field(t('wk.to'), to);
  const add = el('button', 'btn primary wide', t('wk.add'));
  add.type = 'submit';
  form.append(add);
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!mod.value || minutes(to.value) <= minutes(from.value)) return;
    (state.manualSlots[mod.value] ||= []).push({ weekday: Number(day.value), start: from.value, end: to.value, kind: kind.value });
    store.set(SLOTS_KEY, state.manualSlots);
    renderWeek(); renderPlanSide();
  });
  if (!mod.options.length) right.append(el('p', 'empty', t('plan.emptySem'))); else right.append(form);
  right.append(el('p', 'fb-note', t('wk.manualNote')));
  panels.append(left, right);
  box.append(panels);
}

async function loadCalendar() {

    state.calendar = await getJson(`/api/calendar?${params}`);

async function loadJourneys() {

  if (!p || !p.start) { state.journeys = []; return; }
  const params = new URLSearchParams({ lang: state.lang, start: p.start });
  if (department()) params.set('department', department());

/** News and events; headlines from German university pages come in English once translated. */

// ---- opening animation ----
/**
 * A tear-off calendar flips from the first day of the current semester to today (so the month
 * changes when we're later in the semester), then shows the next key date. Resolves once gone.
 */
function playSplash() {
  const root = document.documentElement;
  if (!root.classList.contains('splash')) return Promise.resolve();
  const splash = $('splash');
  const cal = $('spCal');
  const day = $('spDay');
  const month = $('spMonth');
  const now = today();
  const start = termStartDate(termOf(now));
  const span = Math.round((now - start) / DAY);
  // At most 14 flips, evenly spread over the semester so far, always ending on today.
  const steps = Math.min(span, 14);
  const dates = [];
  for (let i = 0; i <= steps; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + (steps === 0 ? 0 : Math.round(span * i / steps)));
    dates.push(d);
  }
  const show = (d) => { month.textContent = fmt(d, { month: 'short' }).replace('.', '').toUpperCase(); day.textContent = String(d.getDate()); };
  let index = 0;
  show(dates[0]);
  const timers = [];
  return new Promise((resolve) => {
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      timers.forEach(clearTimeout);
      splash.classList.add('leave');
      setTimeout(() => { root.classList.remove('splash'); resolve(); }, 450);
    };
    splash.addEventListener('click', finish);
    document.addEventListener('keydown', finish, { once: true });
    const flip = () => {
      if (index < dates.length - 1) {
        index += 1;
        show(dates[index]);
        day.classList.remove('flip');
        void day.offsetWidth;   // restart the flip animation
        day.classList.add('flip');
        timers.push(setTimeout(flip, 75));
      } else {
        const next = state.calendar[0];
        if (next) $('spNext').textContent = `${next.title} · ${countdown(next)}`;
        cal.classList.add('today');
        $('spStage').classList.add('sp-go');
        timers.push(setTimeout(finish, 1700));
      }
    };
    timers.push(setTimeout(flip, 650));
  });
}

// ---- this semester ----
async function loadSemester() {
  try {
    const res = await fetch(`/api/semester?lang=${state.lang}`);
    state.semester = res.ok ? await res.json() : null;
  } catch { state.semester = null; }
}

function renderSemester() {
  const box = $('semBody');
  const card = $('semCard');
  const sem = state.semester;
  card.hidden = !sem;
  if (!sem) return;
  box.replaceChildren();
  const start = parseDay(sem.lectureStart);
  const end = parseDay(sem.lectureEnd);
  const now = today();
  const span = (end - start) / DAY + 1;
  const weeks = Math.ceil(span / 7);
  const top = el('div', 'sem-top');
  const big = el('span', 'sem-big', '0');
  const of = el('span', 'sem-of');
  let value;
  if (now < start) {
    value = Math.round((start - now) / DAY);
    of.append(el('b', null, sem.title), t('sem.startsIn'));
  } else {
    value = Math.min(weeks, Math.floor((now - start) / DAY / 7) + 1);
    of.append(el('b', null, t('sem.week')), t('sem.of', weeks));
  }
  big.dataset.to = String(value);
  top.append(big, of);
  box.append(top);

  const track = el('div', 'sem-track');
  const at = (d) => `${Math.max(0, Math.min(100, ((d - start) / DAY) / span * 100))}%`;
  for (const b of sem.breaks) {
    const zone = el('i', 'sem-break');
    zone.style.left = at(parseDay(b.start));
    zone.style.width = `calc(${at(parseDay(b.end))} - ${at(parseDay(b.start))})`;
    zone.title = b.title;
    track.append(zone);
  }
  const fill = el('i', 'sem-fill');
  fill.dataset.to = at(now);
  track.append(fill);
  if (now >= start && now <= end) {
    const pin = el('span', 'sem-pin', t('sem.today'));
    pin.style.left = at(now);
    // Near either end the label sits beside the line instead of centred on it.
    const pct = parseFloat(at(now));
    if (pct < 8) pin.classList.add('start');
    else if (pct > 92) pin.classList.add('end');
    track.append(pin);
  }
  box.append(track);
  const ends = el('div', 'sem-ends');
  ends.append(el('span', null, fmt(start, LONG)), el('span', null, fmt(end, LONG)));
  box.append(ends);

  const note = el('p', 'sem-note');
  const onBreak = sem.breaks.find((b) => now >= parseDay(b.start) && now <= parseDay(b.end));
  if (now > end) note.append(t('sem.done'));
  else if (onBreak) note.append(t('sem.onBreak', onBreak.title, fmt(new Date(parseDay(onBreak.end).getTime() + DAY), LONG)));
  else if (now >= start) note.append(t('sem.daysLeft', Math.round((end - now) / DAY)));
  if (sem.sourceUrl) {
    const a = el('a', null, t('sem.source'));
    a.href = sem.sourceUrl; a.target = '_blank'; a.rel = 'noopener';
    const src = el('span', 'src');
    src.append(' · ', a);
    note.append(src);
  }
  box.append(note);
  if (card.classList.contains('in')) playSemester();
}

/** Fills the bar and counts the big number up; runs when the card scrolls into view. */
function playSemester() {
  const fill = document.querySelector('#semBody .sem-fill');
  if (fill) requestAnimationFrame(() => { fill.style.width = fill.dataset.to; });
  const big = document.querySelector('#semBody .sem-big');
  if (big) countUp(big, Number(big.dataset.to));
}

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)');

function countUp(node, to, ms = 800) {
  if (REDUCED.matches || !to) { node.textContent = String(to); return; }
  const t0 = performance.now();
  const step = (now) => {
    const p = Math.min(1, (now - t0) / ms);
    node.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// ---- scroll reveal ----
const revealer = ('IntersectionObserver' in window && !REDUCED.matches) ? new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (!e.isIntersecting) continue;
    e.target.classList.add('in');
    revealer.unobserve(e.target);
    if (e.target.id === 'semCard') playSemester();
    if (e.target.id === 'next') e.target.querySelectorAll('.count b').forEach((b) => { if (/^\d+$/.test(b.textContent)) countUp(b, Number(b.textContent), 600); });
  }
}, { threshold: 0.12 }) : null;

function setUpReveal() {
  const targets = ['journey', 'planCard', 'next', 'semCard'].map($).concat([...document.querySelectorAll('main > .layout section[aria-labelledby="feedTitle"], .duo > .card:first-child')]);
  if (!revealer) { targets.forEach((x) => x && x.classList.add('in')); return; }
  document.documentElement.classList.add('js-reveal');
  for (const x of targets) { if (x) { x.classList.add('reveal'); revealer.observe(x); } }
}

  $('fbSend').disabled = true;
  const status = $('fbStatus');

    const res = await fetch('/api/site-feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message, lang: state.lang }) });

    $('fbText').value = '';
    status.textContent = t('fb.thanks');
    status.hidden = false;
    setTimeout(() => $('feedbackDialog').close(), 1400);
  } catch {
    status.textContent = t('fb.error');
    status.hidden = false;
    $('fbSend').disabled = false;
  }
});
