function initialLang() {
  const saved = store.get(KEYS.lang, null);
  if (saved === 'en' || saved === 'de') return saved;
  return (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
}

const state = {
  lang: initialLang(),
  departments: [],
  profile: store.get(KEYS.profile, null),
  calendar: [],
  feed: { news: [], events: [], departmentCovered: false },
  journeys: [],
  journeyState: store.get(KEYS.journeys, {}),
  // What the student ticked off and when, so finished items stay visible: key -> { at, what, sub, journey }.
  history: store.get(KEYS.history, {}),
  // Reminders the student saved from the chat: { id, title, at: 'YYYY-MM-DDTHH:mm', done }.
  reminders: store.get(KEYS.reminders, []),
  journeyConfirm: null,
  done: new Set(store.get(KEYS.done, [])),
  read: new Set(store.get(KEYS.read, [])),
  previousVisit: store.get(KEYS.lastVisit, null),
  kind: 'events', showAll: false,
};
store.set(KEYS.lastVisit, new Date().toISOString());

/** Looks up a text in the current language; function entries are called with the arguments. */
function t(key, ...args) {
  const v = STR[state.lang][key] ?? STR.en[key];
  return typeof v === 'function' ? v(...args) : v;
}

function applyStaticTexts() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach((e) => { e.textContent = t(e.dataset.i18n); });
  // Only our own constant strings are set as HTML (for the <em> in the headline).
  document.querySelectorAll('[data-i18n-html]').forEach((e) => { e.innerHTML = t(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach((e) => { e.placeholder = t(e.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-aria]').forEach((e) => { e.setAttribute('aria-label', t(e.dataset.i18nAria)); });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === state.lang)));
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ---- dates ----
const DAY = 86400000;
function parseDay(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function daysFromToday(iso) { return Math.round((parseDay(iso) - today()) / DAY); }
function fmt(date, opts) { return new Intl.DateTimeFormat(t('locale'), opts).format(date); }
const SHORT = { day: 'numeric', month: 'short' };
const LONG = { day: 'numeric', month: 'short', year: 'numeric' };
const WEEKDAY = { weekday: 'short', day: 'numeric', month: 'short' };
const TIME = { hour: '2-digit', minute: '2-digit' };
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

/** Short countdown phrase for a calendar entry, e.g. "starts tomorrow", "ends in 9 days". */
function countdown(entry) {
  const n = entry.daysLeft;
  if (!entry.end) return t('rel', n);
  if (entry.status === 'UPCOMING') return t('starts', t('rel', n));
  return n === 0 ? t('endsToday') : t('ends', t('rel', n));
}

// ---- semesters ----
// Winter semester y runs 1 Oct y – 31 Mar y+1; summer semester y runs 1 Apr – 30 Sep y.
function termOf(date) {
  const m = date.getMonth() + 1;
  const y = date.getFullYear();
  if (m >= 10) return { ws: true, year: y };
  if (m <= 3) return { ws: true, year: y - 1 };
  return { ws: false, year: y };
}
function termIndex(term) { return term.year * 2 + (term.ws ? 1 : 0); }
function termFromIndex(i) { return { ws: i % 2 === 1, year: Math.floor(i / 2) }; }
function termId(term) { return (term.ws ? 'WS' : 'SS') + term.year; }
function parseTermId(id) { const m = /^(WS|SS)(\d{4})$/.exec(id || ''); return m ? { ws: m[1] === 'WS', year: Number(m[2]) } : null; }
function termLabel(term) { return term.ws ? t('term.ws', term.year) : t('term.ss', term.year); }
function termStartDate(term) { return term.ws ? new Date(term.year, 9, 1) : new Date(term.year, 3, 1); }

/** Current semester number for a study start such as "WS2025", or null if unknown. */
function semesterOf(profile) {
  const start = parseTermId(profile && profile.start);
  if (!start) return null;
  return termIndex(termOf(new Date())) - termIndex(start) + 1;
}

// ---- profile ----
function migrateProfile(p) {
  // Older profiles stored the semester number; turn it into a study start.
  if (p && !p.start && p.semester) {
    p.start = termId(termFromIndex(termIndex(termOf(new Date())) - (p.semester - 1)));
    delete p.semester;
    store.set(KEYS.profile, p);
  }
  return p;
}
state.profile = migrateProfile(state.profile);

function department() { return (state.profile && state.profile.department) || null; }
function deptInfo(id) { return state.departments.find((d) => d.id === id) || null; }
function deptShort(id) { const d = deptInfo(id); return d ? d.name.split(' ').slice(0, 2).join(' ') : ''; }
function shortProgramme(p) { return p ? p.replace(/ ?\([^)]*\)/, '').trim() : ''; }

function profileParts() {
  const p = state.profile;
  const parts = [];
  if (!p) return parts;
  if (p.department) parts.push(deptShort(p.department));
  if (p.programme) parts.push(shortProgramme(p.programme));
  const sem = semesterOf(p);
  if (sem && sem > 0) parts.push(t('sem.short', sem));
  return parts;
}

function renderProfileChip() {
  const p = state.profile;
  const parts = profileParts();
  $('profileText').textContent = parts.length ? parts.join(' · ') : t('profile.setup');
  $('avatar').textContent = p && p.department ? (deptShort(p.department).replace(/\D/g, '') || '★') : '?';
  $('chatContext').textContent = parts.length ? t('chat.context', parts.join(' · ')) : '';
  const sem = semesterOf(p);
  let who = '';
  if (p && p.department) who = ` · ${deptShort(p.department)}${sem && sem > 0 ? t('greet.sem', sem) : ''}`;
  $('greet').textContent = t('greet', new Date().getHours()) + who;
}

/** The profile as currently entered in the dialog, before it is saved. */
function draftProfile() {
  return { department: $('pDept').value || null, programme: $('pProg').value.trim() || null, start: $('pStart').value || null };
}

function openProfile() {
  const sel = $('pDept');
  sel.length = 1;
  sel.options[0].textContent = t('profile.deptNone');
  for (const d of state.departments) sel.append(new Option(d.name, d.id));
  const start = $('pStart');
  start.length = 1;
  start.options[0].textContent = t('profile.startNone');
  const now = termIndex(termOf(new Date()));
  for (let i = now + 1; i >= now - 12; i--) { const term = termFromIndex(i); start.append(new Option(termLabel(term), termId(term))); }
  const p = state.profile || {};
  sel.value = p.department || '';
  $('pProg').value = p.programme || '';
  start.value = p.start || '';
  fillProgrammes();
  updateDraft();
  $('profileDialog').showModal();
}

function fillProgrammes() {
  const list = $('pProgList');
  list.replaceChildren();
  const d = deptInfo($('pDept').value);
  for (const prog of d ? d.programmes : []) list.append(new Option(prog));
}

const previewCache = new Map();
let previewToken = 0;

/** Updates the semester hint and the live feed preview while the student fills in the dialog. */
async function updateDraft() {
  const draft = draftProfile();
  const sem = semesterOf(draft);
  let hint = '';
  if (sem !== null) hint = sem > 0 ? t('profile.semNow', sem) : t('profile.semFuture');
  $('pStartHint').textContent = hint;
  const list = $('pPreview');
  if (!draft.department) { list.replaceChildren(el('li', 'muted', t('preview.empty'))); return; }
  const token = ++previewToken;
  if (!previewCache.has(draft.department)) {
    const preview = await loadFeed(draft.department);
    if (!preview) return;
    previewCache.set(draft.department, preview);
  }
  if (token !== previewToken) return;   // a newer choice is already being shown
  const feed = previewCache.get(draft.department);
  const items = mineItems([...feed.events, ...feed.news], feed.departmentCovered, draft).slice(0, 4);
  list.replaceChildren();
  if (!items.length) { list.append(el('li', 'muted', t('preview.none'))); return; }
  for (const { item, why } of items) {
    const li = el('li');
    li.append(el('time', null, fmt(parseDay(item.date), SHORT)), el('span', null, item.title));
    for (const w of why) li.append(el('span', 'pill why', t(`why.${w}`)));
    list.append(li);
  }
}

$('pDept').addEventListener('change', () => { fillProgrammes(); updateDraft(); });
$('pProg').addEventListener('input', updateDraft);
$('pStart').addEventListener('change', updateDraft);
$('profileChip').addEventListener('click', openProfile);
$('profileDialog').addEventListener('close', () => {
  if ($('profileDialog').returnValue === 'save') state.profile = draftProfile();
  else if (!state.profile) state.profile = { department: null, programme: null, start: null };
  store.set(KEYS.profile, state.profile);
  renderProfileChip();
  loadPersonal();
  renderPlanCard();
});

// ---- up next ----
function nextCard(e) {
  const card = el('article', 'card' + (e.daysLeft <= 7 ? ' urgent' : ''));
  const count = el('div', 'count');
  if (e.daysLeft === 0) {
    count.append(el('b', null, t('next.today')));
  } else {
    const label = e.status === 'ONGOING' ? t('next.left', e.daysLeft) : t('next.toGo', e.daysLeft);
    count.append(el('b', null, String(e.daysLeft)), el('span', null, label));
  }
  card.append(count, el('div', 'title', e.title));
  const dates = e.end ? `${fmt(parseDay(e.start), LONG)} – ${fmt(parseDay(e.end), LONG)}` : fmt(parseDay(e.start), LONG);
  card.append(el('div', 'dates', dates));
  if (e.status === 'ONGOING' && e.end) {
    const total = (parseDay(e.end) - parseDay(e.start)) / DAY;
    const done = (today() - parseDay(e.start)) / DAY;
    const bar = el('div', 'progress');
    const fill = el('i');
    fill.style.width = `${Math.max(3, Math.min(100, Math.round(done / total * 100)))}%`;
    bar.append(fill);
    card.append(bar);
  }
  if (e.sourceUrl) {
    const src = el('div', 'src');
    const a = el('a', null, t('next.source'));
    a.href = e.sourceUrl; a.target = '_blank'; a.rel = 'noopener';
    src.append(a);
    if (e.verifiedOn) src.append(` · ${t('next.checked', fmt(parseDay(e.verifiedOn), SHORT))}`);
    card.append(src);
  }
  return card;
}

function renderNext() {
  const box = $('next');
  box.replaceChildren();
  if (!state.calendar.length) { box.append(el('div', 'card empty', t('next.empty'))); return; }
  for (const e of state.calendar.slice(0, 6)) box.append(nextCard(e));
}

// ---- journeys: the assistant offers to go through things together ----
function journeyProgress(j) {
  const s = state.journeyState[j.id] || {};
  const done = new Set(s.done || []);
  return { state: s, done, count: j.steps.filter((step) => done.has(step.id)).length };
}

function saveJourney(id, patch) {
  state.journeyState[id] = { ...(state.journeyState[id] || {}), ...patch };
  store.set(KEYS.journeys, state.journeyState);
}

/** The journey to offer right now, or null: not finished, not snoozed, reminder (if any) due. */
function offeredJourney() {
  const now = Date.now();
  for (const j of state.journeys) {
    const { state: s, count } = journeyProgress(j);
    if (count >= j.steps.length) continue;
    if (s.snoozeUntil && s.snoozeUntil > now) continue;
    if (s.remindAt && s.remindAt > now) continue;
    return j;
  }
  return null;
}

function renderJourney() {
  const box = $('journey');
  const j = state.journeyConfirm ? state.journeys.find((x) => x.id === state.journeyConfirm.id) : offeredJourney();
  if (!j) { box.hidden = true; return; }
  box.hidden = false;
  const { state: s, count } = journeyProgress(j);
  $('jKicker').textContent = s.remindAt && s.remindAt <= Date.now() ? t('j.reminderKicker') : t('j.kicker');
  $('jTitle').textContent = j.title;
  $('jPrompt').textContent = j.prompt;
  $('jBar').style.width = `${Math.round(count / j.steps.length * 100)}%`;
  $('jCount').textContent = t('j.progress', count, j.steps.length);
  $('jStart').textContent = count > 0 ? t('j.continue') : t('j.start');
  const confirm = state.journeyConfirm;
  $('jActions').hidden = Boolean(confirm);
  $('jConfirm').hidden = !confirm;
  $('jConfirm').textContent = confirm ? confirm.text : '';
  box.dataset.journey = j.id;
}

function openJourney(id) {
  const j = state.journeys.find((x) => x.id === id);
  if (!j) return;
  $('jdTitle').textContent = j.title;
  renderJourneySteps(j);
  $('journeyDialog').showModal();
}

function renderJourneySteps(j) {
  const { done, count } = journeyProgress(j);
  $('jdBar').style.width = `${Math.round(count / j.steps.length * 100)}%`;
  $('jdCount').textContent = t('j.progress', count, j.steps.length);
  const list = $('jdSteps');
  list.replaceChildren();
  for (const step of j.steps) {
    const li = el('li', done.has(step.id) ? 'done' : '');
    const box = el('input');
    box.type = 'checkbox';
    box.checked = done.has(step.id);
    box.setAttribute('aria-label', step.title);
    box.addEventListener('change', () => { toggleStep(j, step.id, box.checked); renderJourneySteps(j); });
    const body = el('div');
    body.append(el('span', 's-title', step.title), el('p', 's-detail', step.detail));
    const actions = el('div', 's-actions');
    // The place where the step is done comes first; the page explaining it next to it.
    if (step.actionLink) { const go = el('a', 's-go', `${step.actionLabel || t('j.go')} ↗`); go.href = step.actionLink; go.target = '_blank'; go.rel = 'noopener'; actions.append(go); }
    if (step.link) { const a = el('a', null, t(step.actionLink ? 'j.info' : 'j.open')); a.href = step.link; a.target = '_blank'; a.rel = 'noopener'; actions.append(a); }
    if (step.ask) {
      const ask = el('button', null, t('j.ask'));
      ask.type = 'button';
      ask.addEventListener('click', () => { $('journeyDialog').close(); openChat(step.ask); });
      actions.append(ask);
    }
    if (step.verifiedOn) actions.append(el('span', 's-checked', t('j.checked', fmt(parseDay(step.verifiedOn), SHORT))));
    const record = state.history[`j:${j.id}:${step.id}`];
    if (done.has(step.id) && record && record.at) actions.append(el('span', 's-checked', `✓ ${t('todo.doneOn', relDone(record.at))}`));
    body.append(actions);
    li.append(box, body);
    list.append(li);
  }
}

function saveReminders() { store.set(KEYS.reminders, state.reminders); }

function setReminderDone(id, done) {
  const r = state.reminders.find((x) => x.id === id);
  if (!r) return;
  r.done = done;
  saveReminders();
  recordDone(`rem:${id}`, done, { what: r.title, sub: t('rem.sub') });
}

/** Remembers when something was ticked off (or forgets it when unticked) for the "Done" list. */
function recordDone(key, checked, entry) {
  if (checked) state.history[key] = { at: Date.now(), ...entry };
  else delete state.history[key];
  store.set(KEYS.history, state.history);
}

function toggleStep(j, stepId, checked) {
  const done = new Set(journeyProgress(j).done);
  if (checked) done.add(stepId); else done.delete(stepId);
  saveJourney(j.id, { done: [...done] });
  const step = j.steps.find((s) => s.id === stepId);
  recordDone(`j:${j.id}:${stepId}`, checked, { what: step ? step.title : stepId, sub: j.title, journey: j.id });
  renderJourney(); renderTodos(); renderChips(); renderNotifications();
}

function remindAt(daysAhead) {
  const d = today();
  d.setDate(d.getDate() + daysAhead);
  d.setHours(9, 0, 0, 0);
  return d;
}

/** Downloads a one-event calendar file so the reminder also lives in the student's own calendar. */
function downloadIcs(j, when) {
  const stamp = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = new Date(when.getTime() + 15 * 60000);
  const text = (s) => s.replace(/[\\,;]/g, (c) => `\\${c}`).replace(/\n/g, '\\n');
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Study Assistant//EN', 'BEGIN:VEVENT',
    `UID:${j.id}-${when.getTime()}@study-assistant`, `DTSTAMP:${stamp(new Date())}`,
    `DTSTART:${stamp(when)}`, `DTEND:${stamp(end)}`,
    `SUMMARY:${text(j.title)}`, `DESCRIPTION:${text(`${t('j.icsDesc')} ${location.origin}/`)}`,
    'BEGIN:VALARM', 'TRIGGER:PT0M', 'ACTION:DISPLAY', `DESCRIPTION:${text(j.title)}`, 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = `${j.id}.ics`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function setRemindMenu(open) {
  $('jMenu').hidden = !open;
  $('jRemind').setAttribute('aria-expanded', String(open));
}

$('jStart').addEventListener('click', () => openJourney($('journey').dataset.journey));
$('jRemind').addEventListener('click', (e) => { e.stopPropagation(); setRemindMenu($('jMenu').hidden); });
$('jMenu').addEventListener('click', (e) => {
  const choice = e.target.closest('button') && e.target.closest('button').dataset.remind;
  if (!choice) return;
  const j = state.journeys.find((x) => x.id === $('journey').dataset.journey);
  const when = remindAt(choice === '3' ? 3 : 1);
  saveJourney(j.id, { remindAt: when.getTime(), snoozeUntil: null });
  if (choice === 'ics') downloadIcs(j, when);
  const label = fmt(when, WEEKDAY);
  state.journeyConfirm = { id: j.id, text: choice === 'ics' ? t('j.icsSaved', label) : t('j.reminderSet', label) };
  setRemindMenu(false);
  renderJourney(); renderNotifications();
});
$('jLater').addEventListener('click', () => {
  const id = $('journey').dataset.journey;
  saveJourney(id, { snoozeUntil: Date.now() + 7 * DAY });
  renderJourney(); renderNotifications();
});
$('jdX').addEventListener('click', () => $('journeyDialog').close());
$('jdClose').addEventListener('click', () => $('journeyDialog').close());
document.addEventListener('click', (e) => { if (!$('jMenu').hidden && !e.target.closest('.remind')) setRemindMenu(false); });

// ---- to-dos: actions from key dates and the next steps of an active journey ----
function todos() {
  const items = state.calendar
    .filter((e) => e.action && ((e.status === 'UPCOMING' && e.daysLeft <= 30) || (e.status === 'ONGOING' && -daysFromToday(e.start) <= 14)))
    .map((e) => {
      const name = e.title.split(',')[0];
      const due = e.status === 'UPCOMING' ? `${name} ${countdown(e)}` : t('todo.started', name);
      return {
        id: `cal:${e.id}`, what: e.action, due, soon: e.status === 'ONGOING' || e.daysLeft <= 7, done: state.done.has(e.id),
        toggle: (on) => {
          if (on) state.done.add(e.id); else state.done.delete(e.id);
          store.set(KEYS.done, [...state.done]);
          recordDone(`cal:${e.id}`, on, { what: e.action, sub: name });
        },
      };
    });
  for (const r of state.reminders.filter((x) => !x.done)) {
    const at = new Date(r.at);
    items.push({
      id: `rem:${r.id}`, what: r.title, due: `⏰ ${fmt(at, WEEKDAY)}, ${fmt(at, TIME)}`, soon: at - Date.now() < 2 * DAY, done: false,
      toggle: (on) => { setReminderDone(r.id, on); },
    });
  }
  for (const j of state.journeys) {
    const { done } = journeyProgress(j);
    for (const step of j.steps.filter((s) => !done.has(s.id)).slice(0, 2)) {
      items.push({ id: `j:${j.id}:${step.id}`, what: step.title, due: j.title, soon: false, done: false, toggle: (on) => toggleStep(j, step.id, on) });
    }
  }
  return items;
}

/** "today", "yesterday", "3 days ago" for a timestamp. */
function relDone(at) {
  const d = new Date(at);
  return t('rel', Math.round((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - today()) / DAY));
}

/** Ticked-off items, newest first; unticking one puts it back on the list. */
function historyItems() {
  // Items ticked before the history existed have no record yet; show them without a date.
  const entries = Object.entries(state.history).map(([key, h]) => ({ key, ...h }));
  const known = new Set(entries.map((h) => h.key));
  for (const j of state.journeys) {
    for (const step of j.steps) {
      const key = `j:${j.id}:${step.id}`;
      if (journeyProgress(j).done.has(step.id) && !known.has(key)) entries.push({ key, at: 0, what: step.title, sub: j.title, journey: j.id });
    }
  }
  for (const e of state.calendar) {
    const key = `cal:${e.id}`;
    if (e.action && state.done.has(e.id) && !known.has(key)) entries.push({ key, at: 0, what: e.action, sub: e.title.split(',')[0] });
  }
  return entries
    .sort((a, b) => b.at - a.at)
    .map((h) => ({
      ...h,
      reopen: () => {
        if (h.key.startsWith('rem:')) {
          setReminderDone(h.key.slice(4), false);
        } else if (h.key.startsWith('cal:')) {
          state.done.delete(h.key.slice(4));
          store.set(KEYS.done, [...state.done]);
          recordDone(h.key, false);
        } else {
          const j = state.journeys.find((x) => x.id === h.journey);
          const stepId = h.key.split(':')[2];
          if (j) toggleStep(j, stepId, false);
          else { saveJourney(h.journey, { done: (journeyProgress({ id: h.journey, steps: [] }).state.done || []).filter((id) => id !== stepId) }); recordDone(h.key, false); }
        }
      },
    }));
}

function renderTodos() {
  const list = $('todo');
  list.replaceChildren();
  list.parentElement.querySelectorAll('details.history').forEach((d) => d.remove());
  const items = todos().filter((item) => !item.done);
  const history = historyItems();
  if (!items.length) list.append(el('li', 'empty', history.length ? t('todo.allDone') : t('todo.empty')));
  for (const item of items) {
    const li = el('li');
    const label = el('label');
    const box = el('input');
    box.type = 'checkbox';
    box.addEventListener('change', () => {
      // Cross it out first, then let it move to the "Done" list.
      li.classList.add('leaving');
      setTimeout(() => {
        item.toggle(box.checked);
        state.historyOpen = true;
        renderTodos(); renderJourney(); renderNotifications();
      }, 550);
    });
    const text = el('div');
    text.append(el('span', 'what', item.what), el('span', 'due' + (item.soon ? ' soon' : ''), item.due));
    label.append(box, text);
    li.append(label);
    list.append(li);
  }
  if (!history.length) return;
  const details = el('details', 'history');
  details.open = Boolean(state.historyOpen);
  details.addEventListener('toggle', () => { state.historyOpen = details.open; });
  details.append(el('summary', null, t('todo.history', history.length)));
  const done = el('ul', 'todo');
  for (const h of history) {
    const li = el('li', 'done');
    const label = el('label');
    const box = el('input');
    box.type = 'checkbox';
    box.checked = true;
    box.title = t('todo.reopen');
    box.setAttribute('aria-label', `${t('todo.reopen')}: ${h.what}`);
    box.addEventListener('change', () => { h.reopen(); renderTodos(); renderJourney(); renderChips(); renderNotifications(); });
    const text = el('div');
    text.append(el('span', 'what', h.what), el('span', 'due', [h.sub, h.at ? t('todo.doneOn', relDone(h.at)) : null].filter(Boolean).join(' · ')));
    label.append(box, text);
    li.append(label);
    done.append(li);
  }
  details.append(done);
  list.after(details);
}

// ---- suggestions ----
function renderChips() {
  const boxes = [$('chips'), $('chatChips')];
  boxes.forEach((box) => box.replaceChildren());
  const seen = new Set();
  const add = (text, tag, soon) => {
    if (seen.has(text) || seen.size >= 6) return;
    seen.add(text);
    for (const box of boxes) {
      const b = el('button', 'chip' + (soon ? ' soon' : ''));
      b.type = 'button';
      if (tag) b.append(el('span', 'tag', tag));
      b.append(text);
      b.addEventListener('click', () => openChat(text));
      box.append(b);
    }
  };
  // The next open step of an active journey comes first.
  for (const j of state.journeys) {
    const { done } = journeyProgress(j);
    const next = j.steps.find((s) => !done.has(s.id) && s.ask);
    if (next) add(next.ask, `🧭 ${j.title}`, false);
  }
  // Suggestions of a key date only make sense before it and in its first two weeks.
  for (const e of state.calendar.slice(0, 3)) {
    const fresh = e.status === 'UPCOMING' || -daysFromToday(e.start) <= 14;
    if (!fresh) continue;
    const tag = e.status === 'UPCOMING' ? `⏰ ${countdown(e)}` : `⏰ ${t('chip.started')}`;
    for (const s of e.suggestions || []) add(s, tag, e.daysLeft > 7);
  }
  for (const s of t('starters')) {
    // Skip a general question when a more specific suggestion already covers its topic.
    if (![...seen].some((x) => x.includes(s.topic))) add(s.text);
  }
}

// ---- feed ----
const NEWCOMER = /(newcomer|erstsemester|ersti|einführung|introduct|orientation|orientierung|welcome|willkommen|studienstart|o-woche|freshm)/i;

function isNew(item) { return Boolean(state.previousVisit) && item.firstSeenAt > state.previousVisit; }

/** Why an item suits a profile: it names their programme, or it is for new students and they are new. */
function reasonsFor(item, profile) {
  const why = [];
  const programme = shortProgramme(profile && profile.programme).toLowerCase();
  if (programme.length >= 4 && item.title.toLowerCase().includes(programme)) why.push('programme');
  const sem = semesterOf(profile);
  if (sem !== null && sem <= 2 && NEWCOMER.test(item.title)) why.push('new');
  return why;
}

/** Items for the "For you" column: the department's own, best matches first; otherwise university items that fit. */
function mineItems(items, covered, profile) {
  const dept = profile && profile.department;
  const pool = covered ? items.filter((i) => i.department === dept) : items.filter((i) => !i.department);
  const ranked = pool.map((item, index) => ({ item, why: reasonsFor(item, profile), index }));
  const shown = covered ? ranked : ranked.filter((r) => r.why.length);
  // Stable: more reasons first, otherwise keep the date order the server sent.
  return shown.sort((a, b) => (b.why.length - a.why.length) || (a.index - b.index));
}

function feedItem(i, why) {
  const a = el('a', 'card item' + (i.department ? ' dept' : ''));
  a.href = i.url; a.target = '_blank'; a.rel = 'noopener';
  const d = parseDay(i.date);
  const tile = el('div', 'date-tile');
  tile.append(el('b', null, String(d.getDate())), el('small', null, fmt(d, { month: 'short' }).replace('.', '')));
  const body = el('div', 'body');
  body.append(el('div', 't', i.title));
  const meta = el('div', 'meta');
  meta.append(el('span', 'pill' + (i.department ? ' dept' : ''), i.source));
  for (const w of why) meta.append(el('span', 'pill why', t(`why.${w}`)));
  if (state.kind === 'events') meta.append(el('span', null, t('rel', daysFromToday(i.date))));
  if (isNew(i)) meta.append(el('span', 'pill new', t('feed.new')));
  body.append(meta);
  a.append(tile, body, el('span', 'arrow', '↗'));
  return a;
}

function renderFeed() {
  document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.kind === state.kind)));
  const dept = department();
  const items = state.kind === 'events' ? state.feed.events : state.feed.news;
  const limit = state.showAll ? Infinity : 5;
  $('mineTitle').textContent = t('feed.mine', dept ? deptShort(dept) : '');

  const note = $('feedNote');
  note.replaceChildren();
  const mineBox = $('feedMine');
  mineBox.replaceChildren();
  let mine = [];
  if (!dept) {
    note.append(el('div', 'note-box', t('feed.pickDept')));
  } else {
    if (!state.feed.departmentCovered) note.append(el('div', 'note-box', t('feed.notCovered', deptShort(dept))));
    mine = mineItems(items, state.feed.departmentCovered, state.profile);
    if (!mine.length) mineBox.append(el('div', 'empty', t('feed.noMine')));
    for (const { item, why } of mine.slice(0, limit)) mineBox.append(feedItem(item, why));
  }

  const uniBox = $('feedUni');
  uniBox.replaceChildren();
  const uni = items.filter((i) => !i.department);
  if (!uni.length) uniBox.append(el('div', 'empty', state.kind === 'events' ? t('feed.noEvents') : t('feed.noNews')));
  for (const i of uni.slice(0, limit)) uniBox.append(feedItem(i, reasonsFor(i, state.profile)));

  $('feedMore').hidden = mine.length <= 5 && uni.length <= 5;
  $('feedMore').textContent = state.showAll ? t('feed.less') : t('feed.more');
}

function notifications() {
  const list = [];
  const offered = offeredJourney();
  if (offered) {
    const { state: s, count } = journeyProgress(offered);
    list.push({ id: `journey:${offered.id}:${s.remindAt || 'new'}`, icon: '🧭', text: offered.title,
      sub: t('j.progress', count, offered.steps.length), action: () => openJourney(offered.id) });
  }
  for (const r of state.reminders.filter((x) => !x.done && new Date(x.at) <= new Date())) {
    list.push({ id: `rem:${r.id}:due`, icon: '⏰', text: r.title, sub: `${t('rem.due')} · ${fmt(new Date(r.at), WEEKDAY)}, ${fmt(new Date(r.at), TIME)}` });
  }
  for (const item of todos()) {
    if (!item.done && item.soon && !item.id.startsWith('rem:')) list.push({ id: `todo:${item.id}`, icon: '⏰', text: item.what, sub: item.due });
  }
  // Events today or tomorrow, own department first; at most three so the bell stays meaningful.
  const soon = state.feed.events
    .filter((e) => { const n = daysFromToday(e.date); return n >= 0 && n <= 1; })
    .sort((a, b) => (b.department ? 1 : 0) - (a.department ? 1 : 0))
    .slice(0, 3);
  for (const e of soon) {
    list.push({ id: `event:${e.url}`, icon: '📅', text: e.title, sub: `${capitalize(t('rel', daysFromToday(e.date)))} · ${e.source}`, url: e.url });
  }
  for (const i of state.feed.news.filter(isNew).slice(0, 3)) {
    list.push({ id: `news:${i.url}`, icon: '🆕', text: i.title, sub: t('notif.newFrom', i.source), url: i.url });
  }
  return list;
}

// ---- chat ----
const log = $('log');

function formatAnswer(text) {
  // Escape first, then add a little formatting; the answer is model output, never trusted HTML.
  const escaped = text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  return escaped.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, (_, nums) => nums.split(',').map((n) => `<span class="cite">${n.trim()}</span>`).join(' '));
}

const AGENT_ICONS = { concierge: '💬', regulations: '📚', deadlines: '⏰', onboarding: '🧭', campus: '🎉', planner: '🗺️', timetable: '🗓️' };

/** One reply from the assistant: which agent answered, the text, cards, one-tap actions and sources. */
function renderReply(data) {
  const box = el('div', 'msg a');
  box.append(el('div', 'agent-tag', `${AGENT_ICONS[data.agent] || '💬'} ${t(`agent.${data.agent}`) || data.agent}`));
  const body = el('div');
  body.innerHTML = formatAnswer(data.text);
  box.append(body);
  if (data.cards && data.cards.length) {
    const cards = el('ul', 'reply-cards');
    for (const c of data.cards) {
      const li = el('li');
      if (c.date) {
        const d = parseDay(c.date);
        const tile = el('div', 'date-tile');
        tile.append(el('b', null, String(d.getDate())), el('small', null, fmt(d, { month: 'short' }).replace('.', '')));
        li.append(tile);
      }
      const text = el('div');
      if (c.url) { const a = el('a', 'c-title', c.title); a.href = c.url; a.target = '_blank'; a.rel = 'noopener'; text.append(a); }
      else text.append(el('span', 'c-title', c.title));
      if (c.detail) text.append(el('span', 'c-detail', c.detail));
      li.append(text);
      cards.append(li);
    }
    box.append(cards);
  }
  if (data.actions && data.actions.length) {
    const actions = el('div', 'reply-actions');
    for (const a of data.actions) actions.append(actionButton(a));
    box.append(actions);
  }
  if (data.sources && data.sources.length) {
    const list = el('ul', 'sources');
    for (const s of data.sources) {
      const li = el('li', null, `[${s.number}] `);
      const a = el('a', null, s.title);
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
      li.append(a, ` · ${t('chat.retrieved', fmt(new Date(s.retrievedAt), LONG))}`);
      list.append(li);
    }
    box.append(list);
  }
  const fb = el('div', 'fb');
  if (data.questionId) {
    for (const [label, rating] of [['👍', 1], ['👎', -1]]) {
      const b = el('button', null, label);
      b.type = 'button';
      b.title = rating > 0 ? t('chat.helpful') : t('chat.notHelpful');
      b.addEventListener('click', async () => {
        fb.querySelectorAll('button[data-rating]').forEach((x) => { x.disabled = true; });
        await fetch(`/api/questions/${data.questionId}/feedback`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ rating }),
        });
      });
      b.dataset.rating = String(rating);
      fb.append(b);
    }
  }
  if ('speechSynthesis' in window) {
    const speak = el('button', 'speak', `🔊 ${t('voice.read')}`);
    speak.type = 'button';
    speak.addEventListener('click', () => {
      if (speaking === speak) { stopSpeaking(); return; }
      speakAnswer(data.text, speak);
    });
    fb.append(speak);
  }
  box.append(fb);
  return box;
}

/** A one-tap action an agent suggested. Nothing happens until the student taps it. */
function actionButton(a) {
  const b = el('button', a.type === 'ASK' ? 'act ask' : 'act', a.label);
  b.type = 'button';
  b.addEventListener('click', () => {
    if (a.type === 'REMINDER') {
      const id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
      state.reminders.push({ id, title: a.title, at: a.at, done: false });
      saveReminders();
      b.textContent = t('rem.saved', `${fmt(new Date(a.at), WEEKDAY)}, ${fmt(new Date(a.at), TIME)}`);
      b.disabled = true;
      renderTodos(); renderNotifications();
    } else if (a.type === 'CALENDAR') {
      downloadIcs({ id: 'reminder', title: a.title }, new Date(a.at));
      b.textContent = t('rem.icsSaved');
      b.disabled = true;
    } else if (a.type === 'OPEN_JOURNEY') {
      openJourney(a.journeyId);
    } else if (a.type === 'OPEN_PLANNER') {
      openPlanner(a.params);
    } else if (a.type === 'ASK') {
      send(a.label);
    }
  });
  return b;
}

// ---- voice ----
let speaking = null;

function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (speaking) speaking.textContent = `🔊 ${t('voice.read')}`;
  speaking = null;
}

/** Reads an answer aloud with the device's own voices, without citation markers and links. */
function speakAnswer(text, button) {
  if (!('speechSynthesis' in window)) return;
  stopSpeaking();
  const clean = text.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, '').replace(/https?:\/\/\S+/g, '').replace(/\*\*/g, '');
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = state.lang === 'de' ? 'de-DE' : 'en-GB';
  const voice = speechSynthesis.getVoices().find((v) => v.lang.startsWith(state.lang));
  if (voice) utterance.voice = voice;
  utterance.onend = () => { if (speaking === button) stopSpeaking(); };
  speaking = button || null;
  if (button) button.textContent = `⏹ ${t('voice.stopRead')}`;
  speechSynthesis.speak(utterance);
}

const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

/** Shows what the voice input is doing under the box the student used. */
function voiceStatus(form, text) {
  const status = form.querySelector('.voice-status') || form.parentElement.querySelector(`.voice-status[data-for="${form.id}"]`);
  if (!status) return;
  status.hidden = !text;
  status.textContent = text || '';
}

/** Puts a microphone button into one of its three looks: off, waiting for permission, listening. */
function setMic(mic, mode) {
  mic.classList.toggle('on', mode === 'on');
  mic.classList.toggle('waiting', mode === 'waiting');
  mic.setAttribute('aria-pressed', String(mode !== 'off'));
  mic.setAttribute('aria-label', mode === 'off' ? t('voice.start') : t('voice.stop'));
}

/**
 * Asks for the microphone before listening. Speech recognition reports a refused permission
 * inconsistently (sometimes not at all), while this request always settles with a clear answer.
 * Returns null when access was granted, otherwise the message to show.
 */
async function microphoneProblem() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;   // let recognition ask itself
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    stream.getTracks().forEach((track) => track.stop());   // only needed the permission
    return null;
  } catch (err) {
    if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') return t('voice.noMic');
    return t('voice.denied');   // refused, dismissed, or blocked by policy
  }
}

let micStarting = false;
let micCancelled = false;

/**
 * Listens for one spoken question: words appear in the box while the student talks, and the
 * question is sent when they stop. Answers to spoken questions are read aloud.
 */
async function listen(form, input, onQuestion) {
  if (recognition) { recognition.stop(); return; }
  const mic = form.querySelector('.mic');
  if (micStarting) {
    // Tapping again while the browser hasn't answered the permission request cancels it.
    micCancelled = true;
    micStarting = false;
    setMic(mic, 'off');
    voiceStatus(form, '');
    return;
  }
  stopSpeaking();
  micStarting = true;
  micCancelled = false;
  setMic(mic, 'waiting');
  voiceStatus(form, t('voice.permission'));
  const problem = await microphoneProblem();
  if (micCancelled) return;
  if (problem) {
    micStarting = false;
    setMic(mic, 'off');
    voiceStatus(form, problem);
    return;
  }
  const rec = new Recognition();
  rec.lang = state.lang === 'de' ? 'de-DE' : 'en-GB';
  rec.interimResults = true;
  rec.maxAlternatives = 1;
  let finalText = '';
  let error = null;
  rec.onstart = () => {
    micStarting = false;
    setMic(mic, 'on');
    voiceStatus(form, `🎙 ${t('voice.listening')} ${t('voice.notice')}`);
  };
  rec.onresult = (e) => {
    let text = '';
    for (const result of e.results) text += result[0].transcript;
    input.value = text;
    if (e.results[e.results.length - 1].isFinal) finalText = text.trim();
  };
  rec.onerror = (e) => { error = e.error; };
  rec.onend = () => {
    recognition = null;
    micStarting = false;
    setMic(mic, 'off');
    if (finalText) { voiceStatus(form, ''); input.value = ''; onQuestion(finalText); return; }
    if (error === 'not-allowed' || error === 'service-not-allowed') voiceStatus(form, t('voice.denied'));
    else if (error === 'audio-capture') voiceStatus(form, t('voice.noMic'));
    else if (error === 'no-speech' || error === 'aborted' || !error) voiceStatus(form, t('voice.nothing'));
    else voiceStatus(form, t('voice.failed'));
  };
  recognition = rec;
  try {
    rec.start();
  } catch {
    recognition = null;
    micStarting = false;
    setMic(mic, 'off');
    voiceStatus(form, t('voice.failed'));
  }
}

function setUpVoice() {
  if (!Recognition) return;   // e.g. Firefox: typing only
  for (const [formId, inputId, onQuestion] of [
    ['heroAsk', 'heroInput', (q) => openChat(q, { voice: true })],
    ['chatAsk', 'chatInput', (q) => send(q, { voice: true })],
  ]) {
    const form = $(formId);
    const mic = form.querySelector('.mic');
    mic.hidden = false;
    mic.addEventListener('click', () => listen(form, $(inputId), onQuestion));
  }
}

/** On wide screens the chat is docked on the right and always open; on narrow ones it slides in. */
const DOCKED = window.matchMedia('(min-width: 1100px)');
function docked() { return DOCKED.matches; }

function openChat(question, options) {
  if (!docked()) {
    $('drawer').classList.add('open');
    $('scrim').classList.add('open');
  }
  $('drawer').setAttribute('aria-hidden', 'false');
  if (question) send(question, options);
  else { introduce(); $('chatInput').focus(); }
}
function closeChat() {
  stopSpeaking();
  if (recognition) recognition.stop();
  if (docked()) return;   // the docked chat stays
  $('drawer').classList.remove('open');
  $('scrim').classList.remove('open');
  $('drawer').setAttribute('aria-hidden', 'true');
}
$('closeChat').addEventListener('click', closeChat);
$('chatFab').addEventListener('click', () => openChat());
function syncDock() {
  if (docked()) {
    $('drawer').classList.remove('open');
    $('scrim').classList.remove('open');
    $('drawer').setAttribute('aria-hidden', 'false');
    introduce();
  } else if (!$('drawer').classList.contains('open')) {
    $('drawer').setAttribute('aria-hidden', 'true');
  }
}
DOCKED.addEventListener('change', syncDock);
$('scrim').addEventListener('click', closeChat);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeChat(); togglePopover(false); setRemindMenu(false); }
  if (e.key === '/' && document.activeElement === document.body) { e.preventDefault(); $('heroInput').focus(); }
});

/**
 * Sends a message to the concierge with what the agents may know about the student. Until there
 * are accounts, this state lives in the browser and travels with each message.
 */
// The last turns of the chat go with each message, so follow-ups like "and when is that?" work.
const chatHistory = [];

/** Module codes the study plan puts in the semester that is running now. */
function plannedThisSemester() {
  if (!state.plan || !state.plan.start) return [];
  const index = termIndex(termOf(new Date())) - termIndex(parseTermId(state.plan.start));
  return (index >= 0 && index < state.plan.semesters.length) ? state.plan.semesters[index].slice(0, 40) : [];
}

async function askAssistant(message) {
  const p = state.profile || {};
  const sem = semesterOf(p);
  const journeyDone = {};
  for (const [id, js] of Object.entries(state.journeyState)) journeyDone[id] = js.done || [];
  const res = await fetch('/api/assistant', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message, language: state.lang, journeyDone,
      profile: { department: p.department || null, programme: p.programme || null, semester: sem && sem > 0 ? sem : null, start: p.start || null },
      reminders: state.reminders.slice(-100).map((r) => ({ title: r.title, at: r.at, done: r.done })),
      planFocus: (state.plan && state.plan.focus) || null, completedModules: (state.plan && state.plan.completed) || [],
      plannedModules: plannedThisSemester(), history: chatHistory.slice(-3),
    }),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/** The first time the chat opens, the assistant introduces itself and its specialists. */
async function introduce() {
  if (log.childElementCount) return;
  try { log.append(renderReply(await askAssistant(state.lang === 'de' ? 'Hilfe' : 'help'))); } catch { /* the chat still works */ }
}

let busy = false;
async function send(question, options = {}) {
  if (busy) return;
  busy = true;
  document.querySelectorAll('.send').forEach((b) => { b.disabled = true; });
  log.append(el('div', 'msg q', question));
  const pending = el('div', 'msg a pending', t('chat.looking'));
  const dots = el('span', 'typing');
  dots.append(el('i'), el('i'), el('i'));
  pending.append(dots);
  log.append(pending);
  pending.scrollIntoView({ behavior: 'smooth', block: 'end' });
  try {
    const data = await askAssistant(question);
    chatHistory.push({ question, answer: String(data.text || '').slice(0, 1500) });
    if (chatHistory.length > 6) chatHistory.shift();
    const answer = renderReply(data);
    pending.replaceWith(answer);
    answer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    // Asked by voice, answered by voice.
    if (options.voice) speakAnswer(data.text, answer.querySelector('.speak'));
  } catch (err) {
    pending.className = 'msg a';
    pending.textContent = t('chat.error', err.message);
  } finally {
    busy = false;
    document.querySelectorAll('.send').forEach((b) => { b.disabled = false; });
    $('chatInput').focus();
  }
}

$('heroAsk').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('heroInput').value.trim();
  if (!q) return;
  $('heroInput').value = '';
  openChat(q);
});
$('chatAsk').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('chatInput').value.trim();
  if (!q) return;
  $('chatInput').value = '';
  send(q);
});

// ---- study planner ----
// The plan lives in the browser until there are accounts: { programme, focus, start, semesters: [[codes]], completed: [codes], max }.
const PLAN_KEY = 'uka.plan';
state.plan = store.get(PLAN_KEY, null);
state.programmes = [];
state.catalogue = null;     // GET /api/programmes/{id}: { programme, history }
state.planResult = null;    // last StudyPlan from the server
let pickSemester = 0;

function savePlan() { store.set(PLAN_KEY, state.plan); }

/** The programme the student's profile points to, if the planner supports it. */
function myProgramme() {
  const p = state.profile || {};
  const name = (p.programme || '').trim().toLowerCase();
  return state.programmes.find((x) => x.imported && (!p.department || x.department === p.department)
    && x.names.some((n) => n.toLowerCase() === name)) || null;
}

async function loadProgrammes() {
  try { state.programmes = await getJson('/api/programmes'); } catch { state.programmes = []; }
  const prog = myProgramme();
  if (prog && state.plan && state.plan.programme === prog.id) {

        semesters: state.plan.semesters, completed: state.plan.completed, maxCreditsPerSemester: state.plan.max,

}

const DEMO_PLAN = [[6, 6, 6, 6, 6], [6, 6, 6, 4, 8], [6, 6, 6, 6, 6], [30]];

/** A mini plan: one column per semester, a block per module, and a ring counting the credits. */
function renderPromoVisual(result) {
  const box = $('pcVisual');
  box.replaceChildren();
  const semesters = result
    ? result.semesters.map((s) => s.modules.map((m) => ({ credits: m.credits, kind: m.thesis ? 'thesis' : (m.requirement && m.requirement.startsWith('8.')) ? 'focus' : 'core' })))
    : DEMO_PLAN.map((col, i) => col.map((c, j) => ({ credits: c, kind: i === DEMO_PLAN.length - 1 ? 'thesis' : j < 2 ? 'focus' : 'core' })));
  const total = result ? result.credits : 120;
  const required = result ? result.requiredCredits : 120;
  box.append(ring(total, required, 'promo-ring'));

/** An SVG ring showing credits out of the required total. */
function ring(value, total, cls) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 120 120');
  svg.setAttribute('class', `ring-svg ${cls || ''}`);
  const r = 52;
  const circumference = 2 * Math.PI * r;
  const back = document.createElementNS(ns, 'circle');
  back.setAttribute('cx', '60'); back.setAttribute('cy', '60'); back.setAttribute('r', String(r)); back.setAttribute('class', 'ring-back');
  const front = document.createElementNS(ns, 'circle');
  front.setAttribute('cx', '60'); front.setAttribute('cy', '60'); front.setAttribute('r', String(r)); front.setAttribute('class', 'ring-front');
  front.style.strokeDasharray = `${circumference}`;
  front.style.setProperty('--ring-offset', String(circumference * (1 - Math.min(1, value / total))));
  front.style.setProperty('--ring-full', String(circumference));
  const text = document.createElementNS(ns, 'text');
  text.setAttribute('x', '60'); text.setAttribute('y', '58'); text.setAttribute('class', 'ring-value');
  text.textContent = String(value);
  const unit = document.createElementNS(ns, 'text');
  unit.setAttribute('x', '60'); unit.setAttribute('y', '80'); unit.setAttribute('class', 'ring-unit');
  unit.textContent = `/ ${total} CP`;
  svg.append(back, front, text, unit);
  return svg;
}

/** Opens the planner; {@code params} (from the Planner agent) can preset focus, semesters and start and plan right away. */
async function openPlanner(rawParams) {
  // {view: 'week'} only picks the view; focus/semesters/start ask for a new plan.
  const view = rawParams && rawParams.view;
  const params = rawParams && (rawParams.focus || rawParams.semesters || rawParams.start) ? rawParams : null;
  if (view) { state.planView = view; store.set('uka.planView', view); }
  const prog = (params && state.programmes.find((x) => x.id === params.programme)) || myProgramme();
  if (!prog) return;
  closeChat();
  try { await ensureCatalogue(prog.id, true); } catch { return; }
  loadTimetable(prog.id);
  const catalogue = state.catalogue.programme;

  const focus = $('plFocus');
  focus.replaceChildren(...prog.focusOptions.map((f) => new Option(f.title, f.code)));
  const count = $('plSemesters');
  count.replaceChildren();
  for (let n = 2; n <= 8; n++) count.append(new Option(String(n), String(n)));

  const plan = (state.plan && state.plan.programme === prog.id) ? state.plan : null;
  const profileStart = (state.profile && state.profile.start) || termId(termOf(new Date()));
  renderPlannerOptions();
  const start = $('plStart');
  focus.value = (params && params.focus) || (plan && plan.focus) || prog.focusOptions[0].code;
  start.value = (params && params.start) || (plan && plan.start) || profileStart;
  if (!start.value) start.value = termId(termOf(new Date()));
  count.value = (params && params.semesters) || (plan ? String(plan.semesters.length) : String(catalogue.regularSemesters));
  $('plMax').value = (plan && plan.max) ? String(plan.max) : '';
  state.planStep = 0;

  renderPlannerChrome();
  setSettingsOpen(!plan && !params);
  $('planner').hidden = false;
  $('planner').scrollTop = 0;
  document.body.classList.add('planner-open');
  if (params || !plan) await generatePlan();
  else await recheck();
  if (state.planResult) setSettingsOpen(false);
}

async function postJson(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

/** The thesis module: the one module worth the thesis credits. */
function thesisCode() {
  const p = state.catalogue.programme;
  const m = Object.values(p.modules).find((x) => x.credits === p.thesisCredits);
  return m ? m.code : null;
}

// Only the newest request may update the page; quick clicks on the controls must not show an older answer.
let planSeq = 0;

function setBusy(busy) {
  $('plMain').classList.toggle('busy', busy);
  $('plGenerate').disabled = busy;
  $('plGenerateText').textContent = t(busy ? 'plan.planning' : 'plan.generate');
}

/**
 * Plans the remaining credits. {@code keep} asks the planner to keep the modules already chosen
 * where they still fit (used when only the number of semesters or the start changes).
 */
async function generatePlan(keep) {
  const seq = ++planSeq;
  const i = planInputs();
  const same = state.plan && state.plan.programme === i.programme;
  const completed = same ? state.plan.completed : [];
  const preferred = (keep && same && state.plan.focus === i.focus) ? state.plan.semesters.flat() : [];
  setBusy(true);
  try {
    const result = await postJson('/api/planner/plan', {
      programme: i.programme, focus: i.focus, start: i.start, semesters: i.semesters, completed, preferred, maxCreditsPerSemester: i.max,
    });
    if (seq !== planSeq) return;
    state.plan = { programme: i.programme, focus: i.focus, start: i.start, max: i.max, completed, manual: false,
      semesters: result.semesters.map((s) => s.modules.map((m) => m.code)) };
    savePlan();
    showPlan(result, true);
  } catch (err) {
    if (seq === planSeq) $('plWarnings').replaceChildren(el('li', 'warn', t('chat.error', err.message)));
  } finally {
    if (seq === planSeq) setBusy(false);
  }
}

/** An empty plan the student fills semester by semester; only the thesis is placed, in the last one. */
function buildMyself() {
  const i = planInputs();
  const completed = (state.plan && state.plan.programme === i.programme) ? state.plan.completed : [];
  const semesters = Array.from({ length: i.semesters }, () => []);
  const thesis = thesisCode();
  if (thesis) semesters[semesters.length - 1].push(thesis);
  state.plan = { programme: i.programme, focus: i.focus, start: i.start, max: i.max, completed, manual: true, semesters };
  state.planStep = 0;
  setPlanView('step');
  recheck();
}

/**
 * Focus, first semester, number of semesters or credit limit changed. A generated plan is planned
 * again (keeping the chosen modules where possible); a plan the student builds keeps its modules.
 */
function settingsChanged(what) {
  if (!state.plan || !state.plan.manual) { generatePlan(what !== 'focus'); return; }
  const i = planInputs();
  Object.assign(state.plan, { focus: i.focus, start: i.start, max: i.max });
  const thesis = thesisCode();
  const semesters = state.plan.semesters.map((s) => s.filter((c) => c !== thesis));
  while (semesters.length > i.semesters) {
    const removed = semesters.pop();
    if (semesters.length) semesters[semesters.length - 1].push(...removed);
  }
  while (semesters.length < i.semesters) semesters.push([]);
  if (thesis) semesters[semesters.length - 1].push(thesis);
  // Modules from removed semesters land in the last study semester, before the thesis.
  if (semesters.length > 1 && thesis) {
    const last = semesters[semesters.length - 1];
    const others = last.filter((c) => c !== thesis);
    if (others.length) { semesters[semesters.length - 2].push(...others); semesters[semesters.length - 1] = [thesis]; }
  }
  state.plan.semesters = semesters;
  state.planStep = Math.min(state.planStep, semesters.length - 1);
  recheck();
}

/** Re-checks the plan after an edit and shows the result. */
async function recheck() {
  if (!state.plan) return;
  const seq = ++planSeq;
  savePlan();
  try {
    const result = await postJson('/api/planner/check', {
      programme: state.plan.programme, focus: state.plan.focus, start: state.plan.start,
      semesters: state.plan.semesters, completed: state.plan.completed, maxCreditsPerSemester: state.plan.max,
    });
    if (seq !== planSeq) return;
    showPlan(result);
  } catch (err) {
    if (seq === planSeq) $('plWarnings').replaceChildren(el('li', 'warn', t('chat.error', err.message)));
  } finally {
    if (seq === planSeq) setBusy(false);
  }
}

const OFFERED_BADGE = { WINTER: 'plan.winter', SUMMER: 'plan.summer', BOTH: 'plan.both', UNKNOWN: 'plan.unknown' };

/** Short display name of a requirement: its English name, or the German one without "Wahlpflicht". */
function shortRequirement(title) {
  const english = uiTitle(title);
  if (english !== title) return english;
  const name = title.replace(/^Wahl(?:pflicht|plficht)\s+/, '');
  return / oder /.test(name) && name.includes(',') ? t('plan.freeElective') : name;
}

function requirementTitle(code) {
  const r = state.planResult && state.planResult.requirements.find((x) => x.code === code);
  return r ? shortRequirement(r.title) : '';
}

function showPlan(result, animate) {
  state.planResult = result;

  renderPlanSide();
  renderPlanCard();
}

function renderPlanWork(animate) {
  if (state.planView === 'step') renderStep(animate);

function semesterHead(s, cls) {
  const term = parseTermId(s.term);
  const sub = el('div', 'pl-col-sub');
  sub.append(el('span', null, t('plan.semester', s.number)), el('b', s.credits > 33 ? 'heavy' : null, `${s.credits} CP`));
  const load = el('div', 'pl-load');

  load.append(fill);
  return [el(cls, 'pl-col-term', term ? termLabel(term) : ''), sub, load];
