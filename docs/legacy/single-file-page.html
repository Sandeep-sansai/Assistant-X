<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c7105c">
<title>Uni Kassel Study Assistant</title>
<meta name="description" content="Unofficial student assistant: deadlines, department news and answers from the University of Kassel's public pages.">
<script>
  // Decide before the first paint: the opening animation plays on every page load, except for
  // people who asked for reduced motion.
  try {
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('splash');
    }
  } catch (e) { /* no animation */ }
</script>
<style>
  /* Look and feel follows the University of Kassel's web design: Roboto, white and flat, square
     boxes, magenta #c7105c for accents and links, lime boxes for key dates, pale blue boxes for
     related content, dark grey bars for side headings. The university's logo and wordmark are
     deliberately not used: this is an unofficial app. */
  @font-face { font-family:"Roboto"; font-weight:300; font-style:normal; font-display:swap; src:url("fonts/roboto-300.woff2") format("woff2"); }
  @font-face { font-family:"Roboto"; font-weight:400; font-style:normal; font-display:swap; src:url("fonts/roboto-400.woff2") format("woff2"); }
  @font-face { font-family:"Roboto"; font-weight:500; font-style:normal; font-display:swap; src:url("fonts/roboto-500.woff2") format("woff2"); }
  @font-face { font-family:"Roboto"; font-weight:700; font-style:normal; font-display:swap; src:url("fonts/roboto-700.woff2") format("woff2"); }

  :root {
    --magenta:#c7105c; --magenta-dark:#9a0c46; --magenta-soft:#f8e6ee;
    --lime:#dee489; --lime-strong:#cfdb3e; --sky:#e1e8f5; --sky-strong:#a0bedf; --mint:#c4dfd5; --orange:#efa712;
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f4f4; --text:#3d3d3d; --strong:#1f1f1f; --muted:#6b6b6b; --line:#dadada;
    --bar:#575757; --on-bar:#ffffff; --on-accent:#ffffff; --on-box:#1f1f1f;
    --link:var(--magenta); --dept:#2f5d8f; --done:#2f7d5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --magenta:#e2458a; --magenta-dark:#c7105c; --magenta-soft:rgba(226,69,138,.16);
      --sky:#26303d; --sky-strong:#3c5270; --mint:#23362f;
      --bg:#151515; --surface:#1d1d1d; --surface-2:#262626; --text:#e6e6e6; --strong:#ffffff; --muted:#a3a3a3; --line:#3a3a3a;
      --bar:#3a3a3a; --dept:#9cc0ea; --done:#7cc7a5;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Roboto", Arial, Helvetica, sans-serif; min-height:100vh; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; }
  button { font:inherit; color:inherit; }
  .icon { width:20px; height:20px; flex:none; }
  .wrap { max-width:1140px; margin:0 auto; padding:0 16px; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .spacer { flex:1; }

  /* Header: white, with the thin magenta rule the university pages have under their menu */
  header { position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--magenta); }
  .bar { display:flex; align-items:center; gap:10px; height:68px; }
  .brand { display:flex; align-items:center; gap:12px; min-width:0; white-space:nowrap; }
  .logo { width:38px; height:38px; display:grid; place-items:center; background:var(--magenta); color:#fff; flex:none; }
  .logo svg { width:22px; height:22px; }
  .brand-name { font-weight:500; font-size:15px; letter-spacing:.12em; text-transform:uppercase; color:var(--strong); line-height:1.15; }
  .brand-name small { display:block; font-weight:400; letter-spacing:0; text-transform:none; font-size:12.5px; color:var(--muted); }
  .icon-btn { position:relative; width:40px; height:40px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; }
  .icon-btn:hover { border-color:var(--magenta); color:var(--magenta); }
  .badge { position:absolute; top:-7px; right:-7px; min-width:19px; height:19px; padding:0 5px; background:var(--magenta); color:#fff;
    font-size:11px; font-weight:700; display:grid; place-items:center; border:2px solid var(--bg); }
  .badge[hidden] { display:none; }
  .profile-chip { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 0; border:1px solid var(--line); background:var(--surface); cursor:pointer; max-width:44vw; }
  .profile-chip:hover { border-color:var(--magenta); }
  .avatar { width:38px; height:38px; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--sky); color:var(--dept); flex:none; }
  .profile-chip .txt { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:14px; }
  .lang { display:inline-flex; height:40px; border:1px solid var(--line); }
  .lang button { border:0; background:transparent; min-width:38px; padding:0 8px; cursor:pointer; font-size:13px; font-weight:500; letter-spacing:.08em; color:var(--muted); }
  .lang button[aria-pressed="true"] { background:var(--bar); color:var(--on-bar); }

  /* Hero */
  .hero { margin:36px 0 34px; }
  .greet { color:var(--muted); font-size:14px; margin:0 0 6px; text-transform:uppercase; letter-spacing:.1em; font-weight:500; }
  .hero h1 { margin:0 0 22px; font-weight:300; font-size:clamp(30px, 4.6vw, 46px); line-height:1.12; color:var(--strong); letter-spacing:-.01em; }
  .hero h1 em { font-style:normal; color:var(--magenta); font-weight:400; }
  .ask { display:flex; border:1px solid var(--text); background:var(--surface); }
  .ask:focus-within { border-color:var(--magenta); box-shadow:inset 0 0 0 1px var(--magenta); }
  .ask input { flex:1; min-width:0; border:0; background:transparent; color:var(--strong); font:inherit; font-size:17px; padding:14px 16px; outline:none; }
  .send { border:0; padding:0 22px; display:flex; align-items:center; gap:8px; cursor:pointer; font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-size:14px;
    color:var(--on-accent); background:var(--magenta); }
  .send:hover { background:var(--magenta-dark); }
  .send:disabled { opacity:.6; cursor:default; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .chip { display:inline-flex; flex-wrap:wrap; align-items:center; gap:4px 10px; border:1px solid var(--line); background:var(--surface); padding:8px 14px; cursor:pointer;
    font-size:14.5px; text-align:left; color:var(--text); }
  .chip:hover { border-color:var(--magenta); color:var(--magenta); }
  .chip .tag { font-size:12px; font-weight:500; padding:2px 8px; background:var(--lime); color:var(--on-box); white-space:nowrap; }
  .chip.soon .tag { background:var(--sky); color:var(--strong); }

  /* Layout */
  .layout { display:grid; gap:34px; grid-template-columns:minmax(0, 1fr); padding-bottom:44px; }
  .duo { display:grid; gap:22px; grid-template-columns:minmax(0, 1fr); align-items:start; }
  @media (min-width: 760px) { .duo { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); } }
  .stack { display:flex; flex-direction:column; gap:34px; }
  section h2 { font-size:22px; font-weight:500; margin:0 0 14px; color:var(--strong); display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  section h2 .hint { font-weight:400; color:var(--muted); font-size:14px; }
  .card { background:var(--surface); border:1px solid var(--line); }

  /* Key dates: pale blue boxes, the nearest one lime like the university's deadline boxes */
  .next { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(175px, 1fr)); }
  @media (max-width: 700px) {
    .next { grid-template-columns:none; grid-auto-flow:column; grid-auto-columns:78%; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; }
  }
  .next .card { border:0; background:var(--sky); padding:18px 18px 16px; scroll-snap-align:start; display:flex; flex-direction:column; gap:8px; min-height:186px; }
  .next .card.urgent { background:var(--lime); color:var(--on-box); }
  .next .card.urgent .dates, .next .card.urgent .src, .next .card.urgent .src a, .next .card.urgent .count span { color:#3d3d3d; }
  .count { display:flex; align-items:baseline; gap:6px; }
  .count b { font-size:38px; line-height:1; font-weight:300; color:var(--strong); }
  .next .urgent .count b { color:#1f1f1f; font-weight:400; }
  .count span { font-size:13px; color:var(--muted); }
  .next .title { font-weight:700; line-height:1.3; color:var(--strong); }
  .next .urgent .title { color:#1f1f1f; }
  .next .dates { font-size:14px; color:var(--text); }
  .progress { height:6px; background:rgba(0,0,0,.08); }
  .progress i { display:block; height:100%; background:var(--magenta); }
  .src { margin-top:auto; font-size:12.5px; color:var(--muted); }
  .src a { color:var(--magenta); }
  .next .urgent .src a { color:#9a0c46; }

  /* Feed */
  .feed-head { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .feed-head h2 { margin:0; }
  .seg { display:inline-flex; border-bottom:1px solid var(--line); }
  .seg button { border:0; background:transparent; padding:8px 14px; cursor:pointer; font-size:14px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);
    border-bottom:2px solid transparent; margin-bottom:-1px; }
  .seg button[aria-pressed="true"] { color:var(--strong); border-bottom-color:var(--magenta); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0 14px; }
  .filters button { border:1px solid var(--line); background:transparent; padding:5px 12px; font-size:13.5px; cursor:pointer; color:var(--text); }
  .filters button[aria-pressed="true"] { background:var(--bar); color:var(--on-bar); border-color:var(--bar); }
  .items { display:flex; flex-direction:column; border-top:1px solid var(--line); }
  .item { display:flex; gap:16px; padding:14px 4px; align-items:center; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--text); }
  .item:hover { text-decoration:none; background:var(--surface-2); }
  .item:hover .t { color:var(--magenta); }
  .date-tile { width:54px; height:58px; flex:none; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--surface-2); line-height:1.05; }
  .date-tile b { font-size:22px; font-weight:400; color:var(--strong); }
  .date-tile small { font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:500; }
  .item.dept .date-tile { background:var(--magenta); }
  .item.dept .date-tile b, .item.dept .date-tile small { color:#fff; }
  .item .body { min-width:0; flex:1; }
  .item .t { font-weight:500; line-height:1.35; color:var(--strong); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:5px; font-size:13px; color:var(--muted); }
  .meta > span:not(.pill) + span:not(.pill)::before, .meta > .pill + span:not(.pill)::before { content:"· "; }
  .pill { font-size:12px; font-weight:500; padding:1px 7px; background:var(--surface-2); color:var(--text); }
  .pill.dept { background:var(--sky); color:var(--dept); }
  .pill.new { background:var(--lime); color:#1f1f1f; }
  .item .arrow { color:var(--magenta); flex:none; padding-right:6px; }
  .empty { padding:18px; color:var(--muted); font-size:14.5px; text-align:center; }
  .note-box { padding:10px 14px; background:var(--sky); color:var(--text); margin-bottom:12px; font-size:14px; border-left:4px solid var(--sky-strong); }
  .more { margin-top:12px; border:1px solid var(--text); background:transparent; width:100%; padding:10px; cursor:pointer; font-weight:500; font-size:14px; }
  .more:hover { border-color:var(--magenta); color:var(--magenta); }

  /* Side boxes: dark grey heading bar, like the university's section navigation */
  .side .card { padding:0; }
  .side .card > h2 { margin:0; padding:10px 16px; background:var(--bar); color:var(--on-bar); font-size:17px; font-weight:500; }
  .side .card > h2 .hint { color:#d9d9d9; font-size:13px; }
  .side .card > ul { padding:10px 10px 12px; }
  .todo { list-style:none; margin:0; display:flex; flex-direction:column; gap:2px; }
  .todo label { display:flex; gap:12px; align-items:flex-start; padding:9px 8px; cursor:pointer; }
  .todo label:hover { background:var(--surface-2); }
  .todo input { appearance:none; width:20px; height:20px; margin:2px 0 0; border:2px solid var(--text); flex:none; display:grid; place-items:center; cursor:pointer; background:var(--surface); }
  .todo input:checked { background:var(--magenta); border-color:var(--magenta); }
  .todo input:checked::after { content:""; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg); }
  .todo .done .what { text-decoration:line-through; color:var(--muted); }
  .todo .due { display:block; font-size:13px; color:var(--muted); }
  .todo .due.soon { color:var(--magenta); font-weight:500; }
  footer { color:var(--muted); font-size:13px; padding:16px 0 36px; border-top:1px solid var(--line); }
  footer p { margin:0 0 6px; }
  .foot-row { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; }
  .beta { display:inline-block; vertical-align:2px; margin-left:4px; padding:1px 6px; font-size:10.5px; font-weight:700; letter-spacing:.08em;
    background:var(--lime); color:#1f1f1f; }
  #feedbackForm textarea { font:inherit; font-size:15px; padding:10px 12px; border:1px solid var(--text); background:var(--surface); color:var(--strong); resize:vertical; border-radius:0; }
  .fb-intro, .fb-note { margin:0; font-size:14px; }
  .fb-note { color:var(--muted); font-size:12.5px; }
  .fb-status { margin:0; font-weight:500; color:var(--done); }

  /* This semester: lecture weeks as a bar, breaks hatched, a pin for today. */
  .sem-card { overflow:hidden; position:relative; }
  .sem-card::before { content:""; position:absolute; inset:0 0 auto 0; height:4px; background:linear-gradient(90deg, var(--magenta), #e2458a 45%, var(--lime)); }
  #semBody { padding:4px 22px 20px; }
  .sem-top { display:flex; align-items:flex-end; gap:14px; margin:4px 0 14px; }
  .sem-big { font-size:56px; font-weight:300; line-height:.9; color:var(--magenta); font-variant-numeric:tabular-nums; }
  .sem-of { font-size:15px; color:var(--muted); padding-bottom:4px; }
  .sem-of b { display:block; font-size:17px; font-weight:500; color:var(--strong); }
  .sem-track { position:relative; height:12px; background:var(--surface-2); margin:22px 0 8px; }
  .sem-fill { position:absolute; inset:0 auto 0 0; width:0; background:linear-gradient(90deg, var(--magenta), #e2458a); transition:width 1.1s cubic-bezier(.2,.8,.2,1); }
  .sem-break { position:absolute; top:0; bottom:0; background:repeating-linear-gradient(135deg, rgba(127,127,127,.35) 0 3px, transparent 3px 7px); }
  .sem-pin { position:absolute; top:-20px; transform:translateX(-50%); font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--magenta);
    opacity:0; transition:opacity .4s .9s; white-space:nowrap; }
  .sem-pin::after { content:""; position:absolute; left:50%; top:16px; width:2px; height:16px; margin-left:-1px; background:var(--magenta); }
  .sem-card.in .sem-pin { opacity:1; }
  .sem-pin.start { transform:translateX(-1px); }
  .sem-pin.start::after { left:1px; }
  .sem-pin.end { transform:translateX(calc(-100% + 1px)); }
  .sem-pin.end::after { left:auto; right:-1px; }
  .sem-ends { display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); }
  .sem-note { margin:12px 0 0; font-size:14px; }
  .sem-note .src { font-size:12.5px; color:var(--muted); }

  /* Cards respond to the pointer. */
  .next .card, .card.item { transition:transform .2s ease, box-shadow .2s ease; }
  .next .card:hover, .card.item:hover { transform:translateY(-3px); box-shadow:0 14px 28px -18px rgba(0,0,0,.45); }
  .card.item .arrow { transition:transform .2s ease; }
  .card.item:hover .arrow { transform:translate(3px, -3px); }
  .next .card { position:relative; overflow:hidden; }
  .next .card::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--dept); opacity:.55; }
  .next .card.urgent::after { background:var(--magenta); opacity:1; }

  /* The highlighted word in the headline gets a lime underline that draws itself. */
  .hero h1 em { background:linear-gradient(var(--lime), var(--lime)) no-repeat 0 92% / 0% .16em; animation:underline .9s .5s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes underline { to { background-size:100% .16em; } }

  /* Sections fade up as they scroll into view (only when scripts run; nothing hides without them). */
  .js-reveal .reveal { opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .js-reveal .reveal.in { opacity:1; transform:none; }
  .js-reveal .next.in .card { animation:rise .5s cubic-bezier(.2,.8,.2,1) both; }
  .js-reveal .next.in .card:nth-child(2) { animation-delay:.07s; }
  .js-reveal .next.in .card:nth-child(3) { animation-delay:.14s; }
  .js-reveal .next.in .card:nth-child(4) { animation-delay:.21s; }
  .js-reveal .next.in .card:nth-child(5) { animation-delay:.28s; }
  .js-reveal .next.in .card:nth-child(6) { animation-delay:.35s; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

  /* Notifications */
  .popover { position:fixed; top:76px; right:max(16px, calc((100vw - 1140px) / 2 + 16px)); width:min(380px, calc(100vw - 32px)); max-height:min(70vh, 560px);
    overflow:auto; z-index:40; box-shadow:0 18px 40px -20px rgba(0,0,0,.35); }
  .popover[hidden] { display:none; }
  .pop-head { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bar); color:var(--on-bar); }
  .pop-head b { font-weight:500; }
  .link-btn { border:0; background:none; color:#fff; text-decoration:underline; cursor:pointer; font-size:13px; padding:2px; }
  #notifList { padding:6px; }
  .notif { display:flex; gap:12px; padding:10px; align-items:flex-start; cursor:pointer; border:0; background:none; width:100%; text-align:left; color:var(--text); }
  .notif:hover { background:var(--surface-2); text-decoration:none; }
  .notif .ic { width:34px; height:34px; display:grid; place-items:center; flex:none; font-size:16px; background:var(--surface-2); }
  .notif.unread .ic { background:var(--lime); }
  .notif .txt { font-size:14px; line-height:1.4; min-width:0; overflow-wrap:anywhere; color:var(--strong); }
  .notif .txt small { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
  .notif.unread .txt::before { content:""; display:inline-block; width:8px; height:8px; background:var(--magenta); margin-right:7px; vertical-align:middle; }

  /* Chat panel: docked on the right on wide screens, a sliding panel with a floating button on narrow ones */
  .t-wide { display:none; }
  .chat-fab { position:fixed; right:18px; bottom:18px; z-index:45; display:flex; align-items:center; gap:8px; border:0; cursor:pointer;
    padding:14px 20px; background:var(--magenta); color:#fff; font:inherit; font-weight:500; letter-spacing:.06em; text-transform:uppercase; font-size:14px;
    box-shadow:0 12px 28px -10px rgba(199,16,92,.7); }
  .chat-fab:hover { background:var(--magenta-dark); }
  .drawer-head .chat-who small { display:flex; align-items:center; gap:6px; }
  .online-dot { width:8px; height:8px; border-radius:50%; background:#3fbf7f; box-shadow:0 0 0 3px rgba(63,191,127,.25); animation:online 2.4s ease-in-out infinite; flex:none; }
  @keyframes online { 50% { box-shadow:0 0 0 6px rgba(63,191,127,0); } }
  .chat-suggest { display:flex; gap:8px; overflow-x:auto; padding:2px 16px 4px; margin-top:8px; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(90deg, #000 85%, transparent); mask-image:linear-gradient(90deg, #000 85%, transparent); }
  .chat-suggest::-webkit-scrollbar { display:none; }
  .chat-suggest .chip { flex:none; font-size:13px; padding:6px 10px; max-width:280px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:inline-block; }
  .chat-suggest .chip .tag { font-size:11px; margin-right:6px; }
  @media (min-width: 1100px) {
    body { padding-right:420px; }
    .t-narrow, .narrow-only, .chat-fab, .scrim, #closeChat { display:none !important; }
    .t-wide { display:inline; }
    .hero { margin:26px 0 22px; }
    /* Doubled class: these must win over the base .drawer rules further down. */
    .drawer.drawer { top:0; width:420px; transform:none; border-left:1px solid var(--line); box-shadow:-12px 0 32px -28px rgba(0,0,0,.5); z-index:15; }
    .drawer.drawer .drawer-head { border-bottom:3px solid var(--magenta); }
    .drawer.drawer #log { background:linear-gradient(180deg, var(--surface-2), var(--bg) 140px); }
    .popover { right:436px; }
  }
  .scrim { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:50; opacity:0; pointer-events:none; transition:opacity .2s; }
  .scrim.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; bottom:0; width:min(500px, 100vw); z-index:60; background:var(--bg); border-left:4px solid var(--magenta);
    display:flex; flex-direction:column; transform:translateX(100%); transition:transform .25s cubic-bezier(.2,.8,.2,1); }
  .drawer.open { transform:none; }
  .drawer-head { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .drawer-head b { font-weight:500; letter-spacing:.1em; text-transform:uppercase; font-size:14px; color:var(--strong); }
  .drawer-head small { display:block; color:var(--muted); font-size:12.5px; }
  #log { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:14px; }
  .msg { padding:12px 15px; white-space:pre-wrap; overflow-wrap:anywhere; max-width:92%; font-size:15px; }
  .msg.q { align-self:flex-end; color:#fff; background:var(--magenta); }
  .msg.a { align-self:flex-start; background:var(--sky); color:var(--text); }
  .msg.pending { color:var(--muted); }
  .typing { display:inline-flex; gap:4px; vertical-align:middle; margin-left:6px; }
  .typing i { width:6px; height:6px; background:var(--magenta); animation:blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay:.2s; } .typing i:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }
  .cite { display:inline-block; font-size:11px; font-weight:700; padding:0 5px; background:var(--magenta); color:#fff; vertical-align:1px; }
  .sources { margin:12px 0 0; padding:10px 0 0; list-style:none; font-size:13px; white-space:normal; border-top:1px solid rgba(0,0,0,.12); }
  .sources li { margin:3px 0; color:var(--muted); }
  .fb { margin-top:10px; display:flex; gap:6px; white-space:normal; }
  .fb button { background:var(--surface); border:1px solid var(--line); cursor:pointer; padding:2px 10px; }
  .fb button[disabled] { opacity:.5; cursor:default; }
  .drawer form { margin:10px 16px 16px; }
  .drawer .context { font-size:12.5px; color:var(--muted); padding:0 16px; margin:0; }

  /* Profile dialog */
  dialog { border:0; border-top:6px solid var(--magenta); padding:0; width:min(470px, calc(100vw - 32px)); background:var(--surface); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:26px; display:flex; flex-direction:column; gap:14px; }
  .dlg h2 { margin:0; font-size:28px; font-weight:300; color:var(--strong); }
  .dlg p { margin:0; color:var(--muted); font-size:14.5px; }
  .field { display:flex; flex-direction:column; gap:6px; font-size:14px; font-weight:500; color:var(--strong); }
  .field select, .field input { font:inherit; font-weight:400; font-size:15.5px; padding:10px 12px; border:1px solid var(--text); background:var(--surface); color:var(--strong); border-radius:0; }
  .field select:focus, .field input:focus { outline:2px solid var(--magenta); outline-offset:-1px; }
  .row { display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
  .btn { border:1px solid var(--text); background:var(--surface); padding:10px 18px; cursor:pointer; font-weight:500; font-size:14px; }
  .btn:hover { border-color:var(--magenta); color:var(--magenta); }
  .btn.primary { border-color:var(--magenta); color:#fff; background:var(--magenta); }
  .btn.primary:hover { background:var(--magenta-dark); color:#fff; }
  .privacy { font-size:12.5px !important; }

  :focus-visible { outline:2px solid var(--magenta); outline-offset:2px; }
  @media (max-width: 560px) {
    .hero { margin-top:24px; }
    .send span { display:none; }
    .send { padding:0 16px; }
    .chips .chip:nth-child(n+5) { display:none; }
    .bar { gap:8px; }
  }
  @media (max-width: 640px) { .brand-name { display:none; } }

  /* Opening animation: a tear-off calendar in the university's colours flips to today, then the
     app's three jobs pop out. */
  #splash { display:none; }
  html.splash #splash { display:grid; }
  html.splash body { overflow:hidden; }
  #splash { position:fixed; inset:0; z-index:100; place-items:center; background:var(--bg); overflow:hidden; cursor:pointer; }
  #splash::after { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--magenta); transform:scaleX(0); transform-origin:left;
    animation:sp-rule 1.1s .1s cubic-bezier(.6,0,.2,1) forwards; opacity:.5; }
  @keyframes sp-rule { to { transform:scaleX(1); } }
  .sp-stage { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:28px; }
  .sp-cal { position:relative; width:136px; height:150px; background:var(--surface); box-shadow:0 0 0 1px var(--line), 0 24px 50px -26px rgba(0,0,0,.45);
    animation:sp-drop .7s cubic-bezier(.2,1.4,.4,1) both; perspective:400px; }
  @keyframes sp-drop { from { transform:translateY(-70px) scale(.5) rotate(-10deg); opacity:0; } to { transform:none; opacity:1; } }
  .sp-top { height:44px; background:var(--magenta); color:#fff; display:grid; place-items:center; font-weight:500; letter-spacing:.22em; font-size:15px; }
  .sp-rings { position:absolute; top:-9px; left:0; right:0; display:flex; justify-content:center; gap:48px; }
  .sp-rings i { width:10px; height:22px; background:var(--bar); }
  .sp-day { height:106px; display:grid; place-items:center; font-size:66px; font-weight:300; color:var(--strong); font-variant-numeric:tabular-nums; transform-origin:50% 0; }
  .sp-day.flip { animation:sp-flip .11s ease-out; }
  @keyframes sp-flip { from { transform:rotateX(-80deg); opacity:.2; } to { transform:none; opacity:1; } }
  .sp-cal.today { animation:sp-drop .7s cubic-bezier(.2,1.4,.4,1) both, sp-pulse .9s ease-out both; }
  .sp-cal.today .sp-day { background:var(--lime); color:#1f1f1f; font-weight:400; transition:background .3s; }
  .sp-cal.today::after { content:""; position:absolute; inset:-3px; border:3px solid var(--magenta); animation:sp-ring 1s ease-out both; }
  @keyframes sp-pulse { 40% { transform:scale(1.07); } 100% { transform:none; } }
  @keyframes sp-ring { from { opacity:.9; transform:scale(1); } to { opacity:0; transform:scale(1.5); } }
  .sp-pill { position:absolute; top:75px; left:50%; display:flex; align-items:center; gap:8px; padding:8px 14px; white-space:nowrap; background:var(--surface);
    border:1px solid var(--text); color:var(--strong); font-weight:500; font-size:14px; opacity:0; transform:translate(-50%, -50%) scale(.4); }
  .sp-pill.p2 { background:var(--lime); border-color:var(--lime); color:#1f1f1f; }
  .sp-pill.p3 { background:var(--sky); border-color:var(--sky); }
  .sp-go .sp-pill { animation:sp-pop .55s cubic-bezier(.2,1.5,.4,1) forwards; }
  .sp-go .sp-pill.p2 { animation-delay:.1s; } .sp-go .sp-pill.p3 { animation-delay:.2s; }
  @keyframes sp-pop { to { opacity:1; transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1); } }
  .sp-pill.p1 { --x:-156px; --y:-58px; } .sp-pill.p2 { --x:162px; --y:-12px; } .sp-pill.p3 { --x:-134px; --y:62px; }
  .sp-brand { text-align:center; opacity:0; transform:translateY(10px); }
  .sp-go .sp-brand { animation:sp-up .5s .35s ease-out forwards; }
  @keyframes sp-up { to { opacity:1; transform:none; } }
  .sp-brand b { display:block; font-size:18px; font-weight:500; letter-spacing:.22em; text-transform:uppercase; color:var(--strong); }
  .sp-brand span { color:var(--muted); font-size:15px; font-weight:300; }
  #splash.leave { animation:sp-leave .45s ease-in forwards; }
  @keyframes sp-leave { to { opacity:0; visibility:hidden; } }
  @media (max-width: 480px) {
    /* Narrow screens: one pill above the calendar, one on each side, none covering it. */
    .sp-pill.p1 { --x:-40px; --y:-116px; } .sp-pill.p2 { --x:124px; --y:-18px; } .sp-pill.p3 { --x:-128px; --y:44px; }
    .sp-pill { font-size:13px; padding:7px 11px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
  /* Feed: personal and university-wide side by side */
  .feed-cols { display:grid; gap:28px; grid-template-columns:minmax(0, 1fr); }
  @media (min-width: 760px) { .feed-cols { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); } }
  .feed-col h3 { margin:0; padding:0 0 8px; font-size:13.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--strong);
    border-bottom:3px solid var(--bar); }
  .feed-col.mine h3 { border-bottom-color:var(--magenta); }
  .feed-col .items { border-top:0; }
  .feed-col .item { gap:12px; padding:12px 2px; }
  .feed-col .date-tile { width:48px; height:52px; }
  .pill.why { background:var(--magenta-soft); color:var(--magenta); }

  /* The assistant offering a journey */
  .nudge { display:flex; gap:18px; padding:22px; background:var(--magenta-soft); border-left:6px solid var(--magenta); }
  .nudge[hidden] { display:none; }
  .nudge-ic { width:46px; height:46px; flex:none; display:grid; place-items:center; background:var(--magenta); color:#fff; }
  .nudge-ic svg { width:24px; height:24px; }
  .nudge-body { min-width:0; flex:1; }
  .kicker { margin:0 0 4px; font-size:12.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--magenta); }
  .nudge h2 { margin:0 0 6px; font-size:26px; font-weight:300; color:var(--strong); display:block; }
  .nudge p.prompt { margin:0 0 12px; font-size:16px; }
  .jprogress { height:6px; background:rgba(0,0,0,.08); margin:4px 0 6px; }
  .jprogress i { display:block; height:100%; width:0; background:var(--magenta); transition:width .3s; }
  .jcount { font-size:13px; color:var(--muted); margin:0 0 14px; }
  .nudge-actions { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .plain-btn { border:0; background:none; color:var(--muted); text-decoration:underline; cursor:pointer; padding:6px; font-size:14px; }
  .remind { position:relative; }
  .menu { position:absolute; top:calc(100% + 6px); left:0; z-index:30; min-width:220px; background:var(--surface); border:1px solid var(--text); display:flex; flex-direction:column; }
  .menu[hidden] { display:none; }
  .menu button { border:0; background:none; text-align:left; padding:10px 14px; cursor:pointer; font-size:14px; }
  .menu button:hover { background:var(--surface-2); color:var(--magenta); }
  .nudge .confirm { margin:0; font-weight:500; }

  /* Journey checklist */
  dialog.wide { width:min(640px, calc(100vw - 32px)); }
  .jd-head { display:flex; align-items:flex-start; gap:12px; }
  .jd-head h2 { flex:1; }
  .steps { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; max-height:min(56vh, 560px); overflow:auto; border-top:1px solid var(--line); }
  .steps li { display:flex; gap:14px; padding:14px 2px; border-bottom:1px solid var(--line); }
  .steps input { appearance:none; width:22px; height:22px; margin:2px 0 0; border:2px solid var(--text); flex:none; display:grid; place-items:center; cursor:pointer; background:var(--surface); }
  .steps input:checked { background:var(--magenta); border-color:var(--magenta); }
  .steps input:checked::after { content:""; width:6px; height:11px; border:solid #fff; border-width:0 2px 2px 0; transform:translateY(-1px) rotate(45deg); }
  .steps .s-title { font-weight:500; color:var(--strong); display:block; }
  .steps li.done .s-title { text-decoration:line-through; color:var(--muted); }
  .steps .s-detail { margin:4px 0 8px; font-size:14.5px; color:var(--text); }
  .steps .s-actions { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; font-size:13.5px; }
  .steps .s-actions button { border:1px solid var(--line); background:var(--surface); padding:4px 10px; cursor:pointer; font-size:13.5px; }
  .steps .s-actions button:hover { border-color:var(--magenta); color:var(--magenta); }
  .steps .s-checked { color:var(--muted); font-size:12.5px; }
  .steps .s-actions a.s-go { background:var(--magenta); color:#fff; padding:5px 12px; font-weight:500; }
  .steps .s-actions a.s-go:hover { background:var(--magenta-dark, #a00c4a); }
  .steps li.done .s-actions a.s-go { background:transparent; color:var(--magenta); padding:0; }

  /* Profile dialog: study start hint and live preview */
  .field-hint { font-weight:400; font-size:13px; color:var(--magenta); min-height:1em; }
  .preview { background:var(--sky); padding:12px 14px; }
  .preview b { display:block; font-size:12.5px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px; color:var(--strong); }
  .preview ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  .preview li { font-size:14px; display:flex; gap:8px; align-items:baseline; }
  .preview li time { flex:none; font-weight:500; color:var(--strong); min-width:54px; }
  .preview .muted { color:var(--muted); font-size:14px; }

  /* Opening animation: the next key date under the name */
  .sp-next { display:inline-block; margin-top:12px; padding:5px 12px; background:var(--lime); color:#1f1f1f; font-size:14px; font-weight:500; }
  .sp-next:empty { display:none; }

  /* To-do: items cross out, then move to the "Done" list */
  .todo li.leaving .what { text-decoration:line-through; color:var(--muted); }
  .todo li.leaving { animation:todo-out .55s ease-in forwards; }
  @keyframes todo-out { 60% { opacity:1; } to { opacity:0; transform:translateX(12px); } }
  .history { margin:0 10px 12px; border-top:1px solid var(--line); }
  .history summary { cursor:pointer; padding:10px 8px 6px; font-size:14px; font-weight:500; color:var(--muted); list-style:none; }
  .history summary::-webkit-details-marker { display:none; }
  .history summary::before { content:"▸ "; color:var(--magenta); }
  .history[open] summary::before { content:"▾ "; }
  .history .todo { padding:0; }
  .history .todo input:checked { background:var(--bar); border-color:var(--bar); }

  /* Voice */
  .mic { border:0; background:transparent; color:var(--muted); padding:0 14px; cursor:pointer; display:grid; place-items:center; }
  .mic[hidden] { display:none; }
  .mic:hover { color:var(--magenta); }
  .mic.on { background:var(--magenta); color:#fff; animation:mic-pulse 1.2s ease-in-out infinite; }
  .mic.waiting { color:var(--magenta); box-shadow:inset 0 0 0 2px var(--magenta); }
  @keyframes mic-pulse { 50% { box-shadow:inset 0 0 0 4px rgba(255,255,255,.35); } }
  .voice-status { margin:8px 0 0; font-size:13.5px; color:var(--magenta); }
  .voice-status[hidden] { display:none; }
  .drawer .voice-status { margin:-8px 16px 14px; }
  .fb .speak { margin-left:auto; }

  /* Agent replies */
  .agent-tag { font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--magenta); margin-bottom:6px; white-space:normal; }
  .reply-cards { list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; white-space:normal; }
  .reply-cards li { display:flex; gap:10px; align-items:center; background:var(--surface); padding:8px 10px; }
  .reply-cards .date-tile { width:42px; height:44px; }
  .reply-cards .date-tile b { font-size:17px; }
  .reply-cards .c-title { display:block; font-weight:500; color:var(--strong); }
  .reply-cards a.c-title { color:var(--magenta); }
  .reply-cards .c-detail { display:block; font-size:13px; color:var(--muted); margin-top:2px; }
  .reply-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; white-space:normal; }
  .reply-actions .act { border:1px solid var(--magenta); background:var(--magenta); color:#fff; padding:6px 12px; cursor:pointer; font-size:14px; font-weight:500; }
  .reply-actions .act.ask { background:var(--surface); color:var(--magenta); font-weight:400; }
  /* Study planner: promo on the start page */
  .promo { position:relative; display:grid; gap:28px; grid-template-columns:minmax(0, 1fr); padding:30px 30px 32px; overflow:hidden;
    background:#232323; color:#f2f2f2; border-left:6px solid var(--magenta); }
  .promo[hidden] { display:none; }
  @media (min-width: 760px) { .promo { grid-template-columns:minmax(0, 1.25fr) minmax(0, 1fr); align-items:center; } }
  .promo::after { content:""; position:absolute; right:-120px; top:-120px; width:340px; height:340px; border-radius:50%;
    background:radial-gradient(circle, rgba(199,16,92,.35), transparent 70%); pointer-events:none; }
  .promo .kicker { color:var(--lime); display:flex; align-items:center; gap:10px; }
  .new-badge { background:var(--magenta); color:#fff; padding:2px 8px; letter-spacing:.12em; }
  .promo h2 { display:block; margin:8px 0 10px; font-size:clamp(28px, 3.6vw, 40px); line-height:1.1; font-weight:300; color:#fff; }
  .promo h2 em { font-style:normal; color:var(--lime); font-weight:400; }
  .promo-sub { margin:0 0 16px; font-size:16px; color:#d8d8d8; max-width:52ch; }
  .promo-points { list-style:none; margin:0 0 22px; padding:0; display:flex; flex-direction:column; gap:8px; }
  .promo-points li { display:flex; gap:10px; font-size:15px; color:#ececec; }
  .promo-points li::before { content:"✓"; color:#1f1f1f; background:var(--lime); width:20px; height:20px; flex:none; display:grid; place-items:center; font-size:12px; font-weight:700; margin-top:1px; }
  .promo-actions { display:flex; flex-wrap:wrap; gap:10px; }
  .promo .btn.primary { padding:12px 20px; font-size:15px; }
  .btn.ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.55); }
  .btn.ghost:hover { border-color:var(--lime); color:var(--lime); }
  .promo-visual { position:relative; z-index:1; display:flex; align-items:center; gap:16px; justify-content:center; min-width:0; }
  .mini-board { display:flex; gap:8px; height:180px; align-items:stretch; }
  .mini-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .mini-col { width:36px; flex:1; display:flex; flex-direction:column; gap:3px; }
  .mini-block { display:block; min-height:6px; background:#7d93ad; transform-origin:top; animation:mini-in .45s cubic-bezier(.2,.9,.3,1.2) both; }
  .mini-block.focus { background:var(--magenta); }
  .mini-block.thesis { background:var(--lime); }
  .mini-label { font-size:11px; letter-spacing:.1em; color:#bdbdbd; }
  @keyframes mini-in { from { transform:scaleY(0); opacity:0; } to { transform:none; opacity:1; } }
  .ring-svg { width:100px; height:100px; flex:none; }
  .ring-back { fill:none; stroke:rgba(127,127,127,.25); stroke-width:10; }
  .ring-front { fill:none; stroke:var(--magenta); stroke-width:10; transform:rotate(-90deg); transform-origin:60px 60px;
    stroke-dashoffset:var(--ring-offset); animation:ring-in 1.1s .2s cubic-bezier(.3,.8,.3,1) both; }
  @keyframes ring-in { from { stroke-dashoffset:var(--ring-full); } }
  .ring-value { font-size:30px; font-weight:400; text-anchor:middle; fill:var(--strong); font-family:inherit; }
  .ring-unit { font-size:11px; text-anchor:middle; fill:var(--muted); letter-spacing:.06em; font-family:inherit; }
  .promo .ring-value { fill:#fff; }
  .promo .ring-unit { fill:#bdbdbd; }
  .promo .ring-front { stroke:var(--lime); }
  @media (max-width: 560px) { .promo { padding:24px 20px; } .mini-board { height:140px; } .mini-col { width:30px; } .promo .ring-svg { width:90px; height:90px; } }

  /* Study planner page */
  body.planner-open { overflow:hidden; }
  .planner { position:fixed; inset:0; z-index:70; background:var(--bg); overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; }
  .planner[hidden] { display:none; }
  .planner .wrap { max-width:1480px; }
  /* Only a slim bar stays on top while scrolling; the settings scroll away with the page. */
  .pl-bar { position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:3px solid var(--magenta); }
  .pl-bar-in { display:flex; align-items:center; gap:16px; min-height:64px; }
  .pl-titles { flex:1; min-width:0; }
  .pl-titles .kicker { margin:0; font-size:11.5px; }
  .pl-titles h2 { margin:0; font-size:20px; font-weight:400; color:var(--strong); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl-views { display:inline-flex; border:1px solid var(--line); background:var(--surface); }
  .pl-views button { border:0; background:transparent; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer; color:var(--text); display:flex; gap:8px; align-items:center; }
  .pl-views button + button { border-left:1px solid var(--line); }
  .pl-views button[aria-selected="true"] { background:var(--bar); color:#fff; }
  .pl-status { display:flex; align-items:center; gap:10px; }
  .pl-status .ring-svg { width:46px; height:46px; }
  .pl-status .ring-value { font-size:34px; }
  .pl-status .ring-unit { display:none; }
  .pl-status .ring-value { transform:translateY(14px); }
  .status-pill { display:inline-block; padding:5px 10px; font-size:13px; font-weight:500; white-space:nowrap; }
  .status-pill.ok { background:var(--lime); color:#1f1f1f; }
  .status-pill.warn { background:var(--magenta); color:#fff; }

  .pl-setup { padding-top:18px; display:flex; flex-direction:column; gap:14px; }
  .pl-summary { display:none; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 16px; background:var(--surface-2); }

  .pl-controls { display:flex; flex-wrap:wrap; gap:12px 18px; align-items:flex-end; padding-bottom:18px; border-bottom:1px solid var(--line); }
  .pl-controls .field { display:flex; flex-direction:column; gap:6px; }
  .pl-controls select { font:inherit; font-size:14.5px; padding:0 10px; height:38px; border:1px solid var(--line); background:var(--surface); color:var(--strong); border-radius:0; min-width:150px; }
  .seg-count { display:inline-flex; border:1px solid var(--line); background:var(--surface); }
  .seg-count button { border:0; background:transparent; width:38px; height:36px; cursor:pointer; font-size:15px; color:var(--text); position:relative; }
  .seg-count button + button { border-left:1px solid var(--line); }
  .seg-count button.regular::after { content:""; position:absolute; left:50%; bottom:4px; width:4px; height:4px; margin-left:-2px; background:var(--lime); }
  .seg-count button[aria-checked="true"] { background:var(--magenta); color:#fff; }
  .pl-go { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }

  .pl-source { margin:0; font-size:12.5px; color:var(--muted); }
  .pl-source a { color:inherit; }

  .pl-main { display:grid; gap:24px; grid-template-columns:minmax(0, 1fr); padding-top:22px; padding-bottom:56px; align-items:start; }
  @media (min-width: 1100px) { .pl-main { grid-template-columns:minmax(0, 1fr) 280px; } }
  .pl-main.busy .pl-work { opacity:.4; pointer-events:none; }
  .pl-work { transition:opacity .2s; min-width:0; }

  /* Overview: semesters wrap onto new rows instead of scrolling sideways. */
  .pl-board[hidden], .pl-step[hidden] { display:none; }
  .pl-board { display:grid; grid-template-columns:repeat(auto-fill, minmax(205px, 1fr)); gap:14px; align-items:start; }
  .pl-col { background:var(--surface-2); display:flex; flex-direction:column; min-height:180px; }
  .pl-col.drop { outline:2px dashed var(--magenta); outline-offset:-2px; background:var(--magenta-soft); }
  .pl-col-head { padding:14px 14px 10px; cursor:pointer; }
  .pl-col-head:hover .pl-col-term { color:var(--magenta); }
  .pl-col-term { font-size:18px; font-weight:400; color:var(--strong); }
  .pl-col-sub { display:flex; justify-content:space-between; margin:2px 0 8px; font-size:12.5px; color:var(--muted); }
  .pl-col-sub b { font-weight:500; color:var(--strong); }
  .pl-col-sub b.heavy { color:var(--magenta); }
  .pl-load { height:3px; background:rgba(127,127,127,.2); }
  .pl-load i { display:block; height:100%; background:var(--bar); transition:width .3s; }
  .pl-load i.heavy { background:var(--magenta); }
  .pl-cards { display:flex; flex-direction:column; gap:6px; padding:4px 10px 10px; flex:1; }
  .pl-card { position:relative; background:var(--surface); border-left:3px solid var(--sky-strong); padding:9px 11px; cursor:grab;
    box-shadow:0 1px 2px rgba(0,0,0,.05); transition:box-shadow .15s; }
  .pl-card:hover, .pl-card:focus-within { box-shadow:0 6px 16px -10px rgba(0,0,0,.35); }
  .pl-card.dragging { opacity:.4; }
  .pl-card.focus { border-left-color:var(--magenta); }
  .pl-card.thesis { background:var(--lime); border-left-color:#8d8400; }
  .pl-card.thesis .pl-title, .pl-card.thesis .pl-meta { color:#1f1f1f; }
  .pl-card.bad { box-shadow:inset 0 0 0 2px var(--magenta); }
  .pl-card.enter { animation:card-in .35s cubic-bezier(.2,.9,.3,1.1) both; }
  @keyframes card-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .pl-card-top { display:flex; gap:8px; align-items:flex-start; justify-content:space-between; }
  .pl-title { font-weight:500; font-size:14px; line-height:1.3; color:var(--strong); text-decoration:none;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  a.pl-title:hover { text-decoration:underline; }
  .term { flex:none; font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:2px 5px; min-width:22px; text-align:center; }
  .term-winter { background:var(--sky); color:var(--dept); }
  .term-summer { background:#fff1cf; color:#8a5a00; }
  .term-both { background:var(--surface-2); color:var(--text); }

  .pl-meta { display:flex; gap:6px; margin-top:3px; font-size:12px; color:var(--muted); align-items:center; min-width:0; }
  .pl-meta > span:not(.req) { flex:none; white-space:nowrap; }
  .pl-meta .req { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .pl-card.focus .pl-meta .req { color:var(--magenta); }
  .pl-actions { display:flex; gap:4px; margin-top:8px; }
  @media (hover: hover) {
    .pl-actions { position:absolute; right:6px; bottom:6px; margin:0; opacity:0; transition:opacity .15s; background:var(--surface); }
    .pl-card:hover .pl-actions, .pl-card:focus-within .pl-actions { opacity:1; }

  }
  .pl-actions button { border:1px solid var(--line); background:var(--surface); width:26px; height:26px; cursor:pointer; font-size:12px; color:var(--text); }
  .pl-actions button:hover { border-color:var(--magenta); color:var(--magenta); }
  .pl-card.thesis .pl-actions button { background:#fff; color:#1f1f1f; border-color:rgba(0,0,0,.2); }
  .pl-add { margin:0 10px 12px; border:1px dashed var(--line); background:transparent; padding:8px; cursor:pointer; font-size:13.5px; color:var(--muted); }
  .pl-add:hover { border-color:var(--magenta); color:var(--magenta); }

  /* Semester by semester: one term at a time, with what is taught in it next to it. */
  .pl-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; }
  .pl-tab { flex:none; min-width:128px; text-align:left; border:1px solid var(--line); background:var(--surface); padding:8px 12px 10px; cursor:pointer; font:inherit; color:var(--text); }
  .pl-tab b { display:block; font-size:12px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .pl-tab span { display:block; font-size:15px; color:var(--strong); margin:2px 0 6px; }
  .pl-tab[aria-selected="true"] { border-color:var(--magenta); box-shadow:inset 0 -3px 0 var(--magenta); }
  .pl-tab[aria-selected="true"] b { color:var(--magenta); }
  .pl-step-body { display:grid; gap:20px; grid-template-columns:minmax(0, 1fr); margin-top:16px; }
  @media (min-width: 900px) { .pl-step-body { grid-template-columns:minmax(0, 1fr) minmax(0, 1.15fr); } }
  .pl-pane { background:var(--surface-2); padding:16px; min-width:0; }
  .pl-pane h3 { margin:0; font-size:20px; font-weight:400; color:var(--strong); }
  .pl-pane .pl-col-sub { margin:4px 0 10px; }
  .pl-pane .pl-cards { padding:12px 0 0; }
  .pl-pane .empty { padding:18px 0; color:var(--muted); font-size:14px; }
  .pl-step-nav { display:flex; justify-content:space-between; gap:8px; margin-top:14px; }
  .pl-step-nav .btn { padding:8px 12px; }
  .pl-hint { margin:0 0 4px; font-size:13.5px; color:var(--muted); }
  .pl-avail-tools { display:flex; flex-direction:column; gap:8px; margin:10px 0 12px; }
  .pl-avail .pk-list { max-height:none; overflow:visible; }
  .pl-avail .pk-row { background:var(--surface); padding:10px 12px; border:0; margin-bottom:6px; }

  /* Week view: one semester's planned modules on a Monday–Friday grid, clashes outlined. */
  .pl-week[hidden] { display:none; }
  .wk-head { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; margin:16px 0 10px; }
  .wk-head h3 { margin:0; font-size:20px; font-weight:400; color:var(--strong); }
  .wk-src { font-size:13px; color:var(--muted); }
  .wk-src.estimate { color:#8a5a00; }
  .wk-grid { position:relative; display:grid; grid-template-columns:48px repeat(var(--days), minmax(0, 1fr)); border:1px solid var(--line); background:var(--surface); }
  .wk-day { text-align:center; font-size:12.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:8px 0; border-bottom:1px solid var(--line); border-left:1px solid var(--line); }
  .wk-times { position:relative; }
  .wk-times span { position:absolute; right:6px; font-size:11px; color:var(--muted); transform:translateY(-50%); }
  .wk-col { position:relative; border-left:1px solid var(--line);
    background:repeating-linear-gradient(to bottom, transparent 0 calc(var(--hour) - 1px), var(--line) calc(var(--hour) - 1px) var(--hour)); }
  .wk-slot { position:absolute; left:3px; right:3px; padding:4px 6px; overflow:hidden; font-size:11.5px; line-height:1.25; color:#1f1f1f;
    border-left:3px solid rgba(0,0,0,.35); animation:rise .35s ease both; }
  .wk-slot b { display:block; font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk-slot.clash { box-shadow:inset 0 0 0 2px var(--magenta); }
  .wk-slot.group { opacity:.75; border-left-style:dashed; }
  .wk-slot .x { position:absolute; top:2px; right:2px; border:0; background:rgba(255,255,255,.7); width:18px; height:18px; cursor:pointer; font-size:11px; padding:0; }
  .wk-mods { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 12px; }
  .wk-mod { display:flex; gap:8px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); padding:7px 10px; font-size:12.5px; max-width:320px; }
  .wk-mod i { flex:none; width:10px; height:10px; margin-top:4px; }
  .wk-mod b { display:block; font-weight:500; color:var(--strong); font-size:13px; }
  .wk-mod span { color:var(--muted); }
  .wk-empty { position:absolute; left:48px; right:0; top:42%; text-align:center; color:var(--muted); font-size:14px; padding:0 20px; pointer-events:none; }
  .wk-fixes { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .wk-fixes .btn { padding:5px 10px; font-size:13px; }
  .wk-legend { display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0 0; font-size:12.5px; color:var(--muted); }
  .wk-legend i { display:inline-block; width:10px; height:10px; margin-right:5px; vertical-align:-1px; }
  .wk-panels { display:grid; gap:16px; grid-template-columns:minmax(0, 1fr); margin-top:16px; }
  @media (min-width: 900px) { .wk-panels { grid-template-columns:minmax(0, 1fr) minmax(0, 1fr); } }
  .wk-panels .pl-pane h4 { margin:0 0 10px; font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .wk-clashes { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13.5px; }
  .wk-clashes li { padding:8px 10px; background:var(--magenta-soft); border-left:3px solid var(--magenta); }
  .wk-clashes li.soft { background:var(--surface); border-left-color:var(--line); }
  .wk-clashes li.ok { background:var(--lime); color:#1f1f1f; border:0; font-weight:500; }
  .wk-missing { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .wk-missing span { font-size:12.5px; padding:3px 8px; background:var(--surface); border:1px solid var(--line); }
  .wk-form { display:grid; gap:8px; grid-template-columns:repeat(2, minmax(0, 1fr)); align-items:end; }
  .wk-form label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  .wk-form select, .wk-form input { font:inherit; font-size:14px; height:36px; padding:0 8px; border:1px solid var(--line); background:var(--surface); color:var(--strong); border-radius:0; min-width:0; }
  .wk-form .wide { grid-column:1 / -1; }
  .wk-form .btn { height:36px; }
  @media (max-width: 700px) { .wk-grid { font-size:10px; } .wk-slot { font-size:10px; padding:2px 3px; } .wk-slot b { font-size:10.5px; } }

  .pl-side { display:flex; flex-direction:column; gap:14px; }
  .pl-side .card { padding:16px; }
  .pl-side .card[hidden] { display:none; }
  .pl-side h3 { margin:0 0 12px; font-size:12px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
  .pl-reqs, .pl-warnings, .pl-done { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px; font-size:13.5px; }
  .pl-reqs .rq-top { display:flex; justify-content:space-between; gap:8px; }
  .pl-reqs .rq-name { color:var(--strong); }
  .pl-reqs li.met { color:var(--muted); }
  .pl-reqs li.met .rq-name { color:var(--muted); }
  .pl-reqs li.met .rq-name::before { content:"✓ "; color:var(--done); font-weight:700; }
  .pl-reqs li.met .rq-bar { display:none; }
  .rq-bar { height:3px; background:rgba(127,127,127,.2); margin-top:4px; }
  .rq-bar i { display:block; height:100%; background:var(--magenta); }
  .pl-warnings li { padding:8px 10px; line-height:1.4; }
  .pl-warnings li.warn { background:var(--magenta-soft); border-left:3px solid var(--magenta); }
  .pl-warnings li.ok { background:var(--lime); color:#1f1f1f; font-weight:500; }
  .pl-warnings li.note { background:var(--surface-2); color:var(--text); font-size:13px; }
  .pl-done li { display:flex; justify-content:space-between; gap:8px; }
  .link-like { border:0; background:none; color:var(--magenta); text-decoration:underline; cursor:pointer; padding:0; font-size:13px; }
  @media (max-width: 700px) {
    .pl-bar-in { flex-wrap:wrap; gap:8px 12px; padding-top:8px; padding-bottom:8px; }
    .pl-views { order:3; width:100%; }
    .pl-views button { flex:1; justify-content:center; white-space:nowrap; padding:8px 6px; font-size:13.5px; }
    .pl-status .status-pill { display:none; }
    .pl-go { margin-left:0; width:100%; }
    .pl-go .btn { flex:1; }
    .pl-controls select { min-width:0; }
  }
  .pk-search { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--text); background:var(--surface); color:var(--strong); border-radius:0; }
  .pk-filter { font-size:14px; display:flex; gap:8px; align-items:center; }
  .pk-list { max-height:min(55vh, 520px); overflow:auto; display:flex; flex-direction:column; gap:14px; }
  .pk-group h3 { margin:0 0 6px; font-size:13px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--magenta); }
  .pk-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); }
  .pk-title { display:block; font-weight:500; color:var(--strong); font-size:14.5px; }
  .pk-meta { display:block; font-size:12.5px; color:var(--muted); }
  .pk-row .btn { padding:6px 12px; }
  .reply-actions .act:disabled { background:var(--surface); color:var(--done); border-color:var(--done); cursor:default; }
</style>

<body>
<div id="splash" aria-hidden="true">
  <div class="sp-stage" id="spStage">
    <div class="sp-cal" id="spCal">
      <div class="sp-rings"><i></i><i></i></div>

  </div>
</div>

<header>
  <div class="wrap bar">
    <div class="brand"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3.5" y="5" width="17" height="15.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14.5h3"/></svg></div><div class="brand-name">Study Assistant <span class="beta">beta</span><small data-i18n="brand.sub"></small></div></div>
    <div class="spacer"></div>
    <div class="lang" role="group" data-i18n-aria="aria.lang">
      <button data-lang="en" aria-pressed="false">EN</button>
      <button data-lang="de" aria-pressed="false">DE</button>
    </div>
    <button class="icon-btn" id="bell" data-i18n-aria="aria.bell" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
    <button class="profile-chip" id="profileChip" data-i18n-aria="aria.profile">
      <span class="avatar" id="avatar">?</span><span class="txt" id="profileText"></span>
    </button>
  </div>
</header>

<div class="card popover" id="notifications" hidden role="dialog" data-i18n-aria="notif.title">

  <div id="notifList"></div>
</div>

<main class="wrap">
  <section class="hero" aria-labelledby="heroTitle">
    <p class="greet" id="greet"></p>
    <h1 id="heroTitle"><span class="t-narrow" data-i18n-html="hero.title"></span><span class="t-wide" data-i18n-html="hero.dash"></span></h1>
    <form class="ask narrow-only" id="heroAsk">
      <label class="sr-only" for="heroInput" data-i18n="aria.question"></label>

      <button class="send"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span data-i18n="hero.ask"></span></button>
    </form>

    <div class="chips narrow-only" id="chips" data-i18n-aria="aria.chips"></div>
  </section>

  <div class="layout">
    <div class="stack">
      <section class="nudge" id="journey" hidden aria-labelledby="jTitle">
        <div class="nudge-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 12l5 5L20 6"/></svg></div>
        <div class="nudge-body">
          <p class="kicker" id="jKicker"></p>
          <h2 id="jTitle"></h2>
          <p class="prompt" id="jPrompt"></p>
          <div class="jprogress"><i id="jBar"></i></div>
          <p class="jcount" id="jCount"></p>

            </div>
            <button class="plain-btn" id="jLater" type="button" data-i18n="j.later"></button>
          </div>
          <p class="confirm" id="jConfirm" hidden></p>
        </div>
      </section>
